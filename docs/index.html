<style>
/* Layout: one narrow column like a paper planner; bottom tab bar; sheets slide up for editing. */
:root{
  --bg:#F7EFE8; --surface:#FFFFFF; --ink:#2E2522; --muted:#76665F; --accent:#8C4A3C; --accent-ink:#FFFFFF;
  --soft:#EED9CF; --line:#EADBD1; --good:#2F7A55; --warn:#A5541E;
  --display:'Cormorant Garamond', 'Times New Roman', serif; --body:'Manrope', -apple-system, 'Segoe UI', sans-serif;
  --radius:22px; color-scheme:light;
}
:root[data-skin="oldmoney"]{
  --bg:#F3EEE4; --surface:#FBF8F2; --ink:#14213D; --muted:#555B6C; --accent:#14213D; --accent-ink:#F3EEE4;
  --soft:#E6DCC6; --line:#DCD2C0; --good:#2D6A4F; --warn:#9A5B13; --radius:8px;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.app{max-width:560px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 150px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:600;text-wrap:balance;letter-spacing:0}
h1{font-size:40px;line-height:1}
h2{font-size:26px;line-height:1.1}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.card{background:var(--surface);border-radius:var(--radius);padding:16px 18px}
.block{display:flex;flex-direction:column;gap:8px}
.block-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.block-btn{width:100%;min-height:52px;font-size:16px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
:root[data-skin="oldmoney"] .btn{border-radius:6px}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
:root[data-skin="oldmoney"] .chip{border-radius:6px}
input[type=text],input[type=time],input[type=date],input[type=number],textarea,select{width:100%;box-sizing:border-box;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:46px}
textarea{min-height:110px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* tasks */
.task{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.check{width:28px;height:28px;flex:none;border-radius:50%;border:1.5px solid var(--muted);background:transparent;display:flex;align-items:center;justify-content:center;padding:0;margin-top:1px}
:root[data-skin="oldmoney"] .check{border-radius:4px}
.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.task-main{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}
.task-title{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.task.done .task-title{text-decoration:line-through;color:var(--muted)}
.meta{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.tag{display:inline-flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
.dot.work{background:var(--accent)} .dot.personal{background:#B98A6A} .dot.custom{background:var(--muted)}
.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--ink);white-space:nowrap}
.pill.warn{background:#F6E1CF;color:var(--warn)}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}

/* hero */
.hello{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.affirm{background:var(--soft);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.affirm p{margin:0;font-family:var(--display);font-style:italic;font-size:23px;line-height:1.2}
:root[data-skin="oldmoney"] .affirm{background:var(--ink);color:var(--bg)}
:root[data-skin="oldmoney"] .affirm .eyebrow{color:#C9B37E}
.banner{border:1px solid var(--warn);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.workbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.toggle{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px}
.toggle[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.event{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.event:last-child{border-bottom:0}
.event time{font-family:var(--display);font-size:20px;font-weight:600;width:56px;flex:none;font-variant-numeric:tabular-nums}
.habit{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

/* segmented */
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
:root[data-skin="oldmoney"] .seg button{border-radius:6px}

/* bottom */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(to top, var(--bg) 70%, transparent);padding:10px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.dock-inner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.capture{display:flex;gap:8px;align-items:center}
.capture input{border-radius:999px;min-height:50px}
.capture .go{width:50px;height:50px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);flex:none;display:flex;align-items:center;justify-content:center}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border-radius:18px;padding:4px;border:1px solid var(--line)}
.tabs button{min-height:46px;border:0;background:transparent;border-radius:14px;font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabs button[aria-current="page"]{color:var(--ink);background:var(--soft)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,16,14,.35);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:24px 24px 0 0;max-height:88%;overflow-y:auto;padding:18px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.sheet-inner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom, 0px));z-index:50;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:14px;font-weight:600;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.toast button{background:none;border:0;color:inherit;text-decoration:underline;font-weight:700;padding:6px}

/* onboarding */
.ob{min-height:calc(100% - 40px);display:flex;flex-direction:column;gap:18px;padding-top:12px}
.progress{display:flex;gap:5px}
.progress span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress span.on{background:var(--accent)}
.skin-card{border:2px solid var(--line);border-radius:20px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.skin-card[aria-pressed="true"]{border-color:var(--ink)}
.swatches{display:flex;gap:6px}
.swatches i{width:22px;height:22px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.08)}

/* dynamics */
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:140px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.bar i{display:block;width:100%;max-width:28px;border-radius:6px 6px 2px 2px;background:var(--accent);min-height:3px}
.bar small{font-size:11px;color:var(--muted);font-weight:700}
.bar b{font-size:12px;font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:600}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.srt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
<style>
.voice{display:flex;flex-direction:column;gap:10px;background:var(--surface);border-radius:var(--radius);padding:16px}
.voice textarea{min-height:220px;font-size:16px;border:0;background:var(--bg)}
.mic-hint{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--muted)}
.mic-hint svg{flex:none;margin-top:1px;color:var(--accent)}
.prompts{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.prompts li{font-size:14px;padding-left:14px;position:relative}
.prompts li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.sph-row{display:flex;gap:8px;align-items:center}
.sph-row input{flex:1;min-width:0}
.live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.goal{font-family:var(--display);font-size:19px;line-height:1.25}


/* day strip */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;margin:0 -2px;scrollbar-width:none;scroll-snap-type:x proximity}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:54px;min-height:72px;border-radius:16px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;scroll-snap-align:start;padding:6px 0}
.day[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.d-wd{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.85}
.d-n{font-family:var(--display);font-size:24px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.d-c{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;opacity:.9}
.affirm-line{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.affirm-line p{margin:0;font-family:var(--display);font-style:italic;font-size:20px;line-height:1.25;color:var(--accent)}
:root[data-skin="oldmoney"] .affirm-line p{color:#8A6A2F}
.affirm-line .btn{min-height:44px;padding:0 10px;flex:none}
.sub-h{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}
/* accessibility fixes */
:root{--ctl:#8A7B74}
:root[data-skin="oldmoney"]{--ctl:#7D8294}
input[type=text],input[type=time],input[type=date],input[type=number],textarea,select{font-size:16px;border-color:var(--ctl)}
::placeholder{color:var(--muted);opacity:1}
.pill.warn{color:#8A4F0F}
.chip,.seg button,.toggle{min-height:44px}
.check{position:relative}
.check::after{content:"";position:absolute;inset:-8px}
.toast button{min-height:44px;min-width:44px}
.toast :focus-visible{outline-color:var(--bg)}
:root[data-skin="oldmoney"] .affirm :focus-visible{outline-color:#C9B37E}
.day:focus-visible{outline-offset:3px}
/* old money: consistent squared corners */
:root[data-skin="oldmoney"] input,:root[data-skin="oldmoney"] textarea,:root[data-skin="oldmoney"] select,:root[data-skin="oldmoney"] .tabs,:root[data-skin="oldmoney"] .tabs button,:root[data-skin="oldmoney"] .toast,:root[data-skin="oldmoney"] .skin-card,:root[data-skin="oldmoney"] .toggle,:root[data-skin="oldmoney"] .day,:root[data-skin="oldmoney"] .capture input,:root[data-skin="oldmoney"] .capture .go,:root[data-skin="oldmoney"] .pill{border-radius:6px}
:root[data-skin="oldmoney"] .sheet{border-radius:10px 10px 0 0}
:root[data-skin="oldmoney"] .card{box-shadow:inset 0 0 0 1px var(--line)}


/* diary */
.diary{list-style:none;margin:6px 0 0;padding:0;border-top:1px solid var(--line)}
.d-row{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;min-height:40px;border-bottom:1px dashed var(--line);position:relative}
.d-row.busy .d-h{color:var(--ink);font-weight:700}
.d-h{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:6px}
.d-cell{display:flex;flex-direction:column;gap:4px;padding:5px 0;min-width:0}
.d-item{border-radius:10px;padding:6px 10px;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
.d-item.event{background:var(--soft)}
.d-item.task{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--accent)}
.d-t{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
.d-title{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.d-sub{font-size:12px;color:var(--muted);width:100%}
.d-mark{font-size:11.5px;color:var(--muted);font-style:italic}
.d-row.now{background:linear-gradient(to right, var(--soft), transparent 70%)}
.d-now{position:absolute;right:0;top:6px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.d-allday{display:flex;gap:6px;flex-wrap:wrap}
:root[data-skin="oldmoney"] .d-item{border-radius:4px}
/* assistant */
.chat{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto;padding:2px}
.msg{padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.45;max-width:92%}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--bg);border-bottom-left-radius:4px}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:4px}
.life-row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.life-row:last-child{border-bottom:0}
.life-dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--ctl);flex:none}
.life-dot.on{background:var(--accent);border-color:var(--accent)}
.tabs button span{font-size:11px}
/* iOS: поля времени не вылезают за край */
.f{min-width:0}
input[type=time],input[type=date]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;display:block}
input::-webkit-date-and-time-value{text-align:left}
.mic-big{align-self:flex-start;display:inline-flex;gap:8px;align-items:center;min-height:48px;padding:0 20px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mic-round{width:50px;height:50px;border-radius:50%;border:1px solid var(--ctl);background:var(--surface);color:var(--accent);flex:none;display:flex;align-items:center;justify-content:center}
.mic-big.rec,.mic-round.rec{background:#B3261E;border-color:#B3261E;color:#fff;animation:micp 1.4s ease-in-out infinite}
.mic-dot{width:12px;height:12px;border-radius:3px;background:#fff;display:inline-block}
@keyframes micp{0%,100%{box-shadow:0 0 0 0 rgba(179,38,30,.45)}50%{box-shadow:0 0 0 10px rgba(179,38,30,0)}}
@media (prefers-reduced-motion:reduce){.mic-big.rec,.mic-round.rec{animation:none}}
:root[data-skin="oldmoney"] .mic-round{border-radius:6px}

.sw .task{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}

.paper .d-item.task.has-c,.d-item.task.has-c{border-left-color:var(--c);box-shadow:inset 3px 0 0 var(--c)}

.counter{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:6px 0 10px}

.pick-row{display:flex;align-items:center;gap:10px;min-height:44px;border-bottom:1px solid var(--line)}
.btn.danger{color:#fff;background:var(--warn);border-color:var(--warn)}

/* ===== Шрифт: ровный, дружелюбный, как в Finch / iOS (SF Pro Rounded → Nunito) ===== */
:root{--display:ui-rounded,'SF Pro Rounded','Nunito',-apple-system,system-ui,sans-serif;--serif:ui-rounded,'SF Pro Rounded','Nunito',-apple-system,system-ui,sans-serif;--body:-apple-system,'SF Pro Text','Nunito',system-ui,sans-serif}
h1,h2,h3,.pg-h,.hd h1{font-family:var(--display)!important;font-weight:700!important;letter-spacing:-.01em}
.hd h1{font-size:30px;line-height:1.1}
.hd-line,.affirm p{font-family:var(--body)!important;font-style:normal!important;font-size:15px!important;color:var(--muted)}
.dc-n,.ag-n,.db-n,.pg-n,.wk-title,.plan .wk-title,.week-title,.mc-n,.dc-n{font-family:var(--display)!important;font-style:normal!important;font-weight:700}
.d-h,.d-t,.event time,.stat b{font-family:var(--body)!important;font-style:normal!important}
.ob h1,.ob h2,[class*=ob-] h1{font-family:var(--display)!important;font-weight:700!important}
/* ===== Нижняя строка «Скажи или напиши» + вкладки ===== */
.dock{flex-direction:column;align-items:stretch;gap:8px}
.dock .say-bar{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:999px;padding:5px 5px 5px 18px;box-shadow:0 6px 24px rgba(43,37,34,.10);border:.5px solid var(--hair)}
.dock .say-in{flex:1;min-width:0;border:0;background:none;text-align:left;font-size:16px;color:var(--muted);min-height:44px;padding:0;font-family:var(--body)}
.dock .say-mic{width:48px;height:48px;flex:none;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center}
.dock .say-mic svg{width:22px;height:22px}
.dock .tabs{flex:none;width:100%}
.dock .mic-fab{display:none}
#app{padding-bottom:calc(200px + env(safe-area-inset-bottom,0px))!important}
.toast{bottom:calc(190px + env(safe-area-inset-bottom,0px))!important}
/* сделанное на месте — зачёркнуто, галочка зелёная */
.task.r.done .task-title{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.od .grp-h h3{color:var(--muted)!important}
.al-steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.4}

/* ===== Polish pass (impeccable · taste · emil) — preview only ===== */
:root{
  --muted:#6E645D;              /* было #8A7F78 — 3.6:1, теперь ≈5:1 на фоне */
  --line:#E7DFD6;
  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-drawer:cubic-bezier(.32,.72,0,1);
  --done:#34A853;
}
html{-webkit-tap-highlight-color:transparent}
::selection{background:color-mix(in srgb,var(--accent) 22%,transparent)}
input,textarea{caret-color:var(--accent)}
:focus-visible{outline:2px solid color-mix(in srgb,var(--accent) 70%,transparent);outline-offset:2px;border-radius:10px}
body{font-variant-numeric:tabular-nums}

/* --- Шапка: заголовок первым, дата и счётчик под ним (без «бровки» над заголовком) --- */
.hd{gap:2px}
.hd h1{order:1;font-size:32px;line-height:1.08;letter-spacing:-.02em}
.hd-date{order:2;font-size:15px;color:var(--muted);margin-top:4px}
.hd-line{order:3;font-size:15px!important;color:var(--muted);padding-top:0}

/* --- «Начни с этого»: дело — главное, подпись под ним --- */
section.now{padding:16px 18px;gap:4px}
section.now .now-r{order:1}
section.now .now-l{order:2;color:var(--muted);font-weight:500;font-size:14px;padding-left:44px}
section.now .now-t{font-size:20px;font-weight:600;letter-spacing:-.01em}

/* --- Группы: iOS-подписи секций, ровные отступы --- */
.home{gap:22px}
.grp{gap:8px}
.grp-h{padding:0 6px}
.grp-h h3{font-size:14px;font-weight:600;color:var(--muted)}
.grp-b{border-radius:16px}
.task.r{padding:12px 0}
.task.r .task-title{font-size:17px}
.task.r .t-time{color:var(--ink);opacity:.55;font-weight:500}
.more{color:var(--accent);font-weight:500}

/* --- Галочка: мягкое «щёлк», зелёная заливка --- */
.check{transition:transform 160ms var(--ease-out),background-color 200ms ease,border-color 200ms ease}
.check:active{transform:scale(.88)}
.check[aria-pressed="true"]{animation:none!important}
.check[aria-pressed="true"] svg{animation:tick 260ms var(--ease-out) both}
@keyframes tick{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.task.r.done .task-title{transition:color 200ms ease}

/* --- Нажатия: всё, что нажимается, чуть «проседает» --- */
button,.ios-r,.ag-t,.task-main{transition:transform 160ms var(--ease-out),background-color 160ms ease,opacity 160ms ease}
button:active,.ios-r:active{transform:scale(.97)}
.dock .tabs button:active{transform:scale(.94)}
@media (hover:hover) and (pointer:fine){ .ios-r:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)} }

/* --- Нижняя зона: системная панель вкладок, строка ввода над ней, без парящих теней --- */
.dock{left:0!important;right:0!important;max-width:none!important;margin:0!important;padding:8px 16px calc(4px + env(safe-area-inset-bottom,0px))!important;gap:6px;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-top:.5px solid var(--line);pointer-events:auto}
.dock .say-bar{box-shadow:none;border:.5px solid var(--line);background:var(--surface);padding:4px 4px 4px 16px}
.dock .say-in{color:var(--muted);font-size:16px}
.dock .say-mic{width:44px;height:44px}
.dock .tabs{height:52px;padding:0;border:0;border-radius:0;background:none;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.dock .tabs button{min-height:50px;border-radius:12px;font-size:10.5px;color:#8E847D}
.dock .tabs button[aria-current="page"]{background:none;color:var(--accent)}
.dock .tabs button svg{width:24px;height:24px}

/* --- Неделя: сегодня выделено тоном, а не цветной рамкой --- */
.ag-day{border-radius:16px}
.ag-day.today{border:0!important;box-shadow:none!important;background:var(--surface)}
.ag-day.today .ag-h{background:color-mix(in srgb,var(--accent) 8%,var(--surface));border-radius:16px 16px 0 0}
.ag-day.today .ag-wd{color:var(--accent);font-weight:600}
.ag-h{min-height:52px}
.ag-n{font-size:26px!important;font-weight:700;letter-spacing:-.02em}
.ag-it{min-height:48px}
.ag-empty{color:var(--muted);font-size:14px;padding:6px 8px}
.wk-title span{letter-spacing:-.02em}

/* --- Шторки (окно дела, добавление): iOS-кривая, быстрый выход --- */
.sheet{animation:sheetIn 380ms var(--ease-drawer) both}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:translateY(0)}}
.toast{animation:toastIn 260ms var(--ease-out) both}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}

/* --- Ассистент: без декоративных теней --- */
.talk .orb{box-shadow:none}
.assist .talk{border:.5px solid var(--line)}

@media (prefers-reduced-motion:reduce){
  .sheet,.toast,.check[aria-pressed="true"] svg{animation:none!important}
  button:active,.ios-r:active,.check:active{transform:none}
}
html,body{overscroll-behavior-y:none}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,textarea,select{font-size:max(16px,1em)}
/* прокручивается только содержимое, окно стоит на месте — нижняя панель не «плавает» на iPhone */
html{height:100%;overflow:hidden}
body{height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:none}
.dock{transform:translateZ(0)}
/* подсказка вверху экрана — компактная, не растягивается на весь экран */
.toast.top{bottom:auto!important;height:auto!important;max-height:40vh}
.toast{height:auto;align-items:center}
/* полоса под часами и батареей: контент не просвечивает под статус-баром */
body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:55;pointer-events:none}
.app{padding-top:max(12px, calc(env(safe-area-inset-top,0px) + 8px))}
.me-more summary{list-style:none;cursor:pointer;color:var(--accent);font-weight:600;padding:6px 4px;min-height:44px;display:flex;align-items:center}
.me-more summary::-webkit-details-marker{display:none}
.me-more[open] summary{margin-bottom:8px}
.sugg.wrap{flex-wrap:wrap;overflow:visible}
.ai-help{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:16px;background:var(--surface);border:.5px solid var(--line);font-size:15px}
.ai-help b{font-size:16px}
/* запись: кольцо дышит в такт голосу */
[data-mic-for].rec{box-shadow:0 0 0 calc(4px + var(--lvl,0) * 14px) color-mix(in srgb,var(--accent) 28%,transparent);transition:box-shadow 90ms linear}

/* ===== Интерфейсы: общий выбор ===== */
.if-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.if-card{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);text-align:left;color:var(--ink)}
.if-card[aria-checked="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.if-card b{font-size:15px;margin-top:8px}
.if-card small{font-size:12.5px;color:var(--muted)}
.if-sw{display:flex;gap:4px}
.if-sw i{width:22px;height:22px;border-radius:7px;display:block}
.if-warm .if-sw i:nth-child(1){background:#F7F3EE;border:1px solid #E7DFD6}.if-warm .if-sw i:nth-child(2){background:#8C4A3C}.if-warm .if-sw i:nth-child(3){background:#2B2522}
.if-flow .if-sw i:nth-child(1){background:#7B8CFF}.if-flow .if-sw i:nth-child(2){background:#FF8A65}.if-flow .if-sw i:nth-child(3){background:#4FC3A1}
.if-tiles .if-sw i:nth-child(1){background:#141416}.if-tiles .if-sw i:nth-child(2){background:#D7FF5A}.if-tiles .if-sw i:nth-child(3){background:#E6E1FF}
.if-clean .if-sw i:nth-child(1){background:#fff;border:1px solid #E5E5EA}.if-clean .if-sw i:nth-child(2){background:#2F7CF6}.if-clean .if-sw i:nth-child(3){background:#F5B301}

/* ===== B · Лента дня ===== */
:root[data-iface="flow"]{--bg:#FFFFFF;--surface:#F5F5F8;--ink:#16161A;--muted:#6E6E78;--line:#ECECF1;--accent:#FF6B4A;--accent-ink:#fff;--soft:#F1F1F5;--done:#34A853}
:root[data-iface="flow"] body{background:#fff}
.iface-flow{gap:14px}
.fl-hd{display:flex;align-items:baseline;justify-content:space-between;padding:4px 2px 0}
.fl-hd h1{font-size:30px!important;font-weight:800!important;letter-spacing:-.02em}
.fl-cnt{font-size:14px;font-weight:600;color:var(--muted)}
.fl-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.fl-d{height:58px;border:0;border-radius:16px;background:var(--surface);color:#55555E;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}
.fl-d span{font-size:11px}.fl-d b{font-size:17px;font-family:var(--display)}
.fl-d i{width:4px;height:4px;border-radius:2px;background:transparent}.fl-d i.has{background:#4FC3A1}
.fl-d.on{background:var(--ink);color:#fff}.fl-d.on i.has{background:#fff}
.fl-d.past{opacity:.6}
.fl-line{list-style:none;margin:6px 0 0;padding:0;position:relative}
.fl-line::before{content:"";position:absolute;left:69px;top:10px;bottom:10px;width:2px;background:repeating-linear-gradient(#E3E3EA 0 6px,transparent 6px 12px)}

const CMD_TITLE=/(^|\s)(?:поставь|поставить|создай|создать|добавь|добавить|запиши|записать|заведи|внеси|напомни|напомнить)(\s|$)|^(?:заметку|заметка|пометку|задачу)\s|напоминанием/i;
function fixCmdTitles(o){
  const fx=x=>{ if(!x||!x.title||!CMD_TITLE.test(x.title)) return; const p=parseRu(x.title); if(p.title && p.title.length>=3){ x.title=p.title; } if(!x.time && p.time) x.time=p.time; };
  arr(o.tasks).forEach(fx); arr(o.recur).forEach(fx);
}
function merge(saved){
  const d=DEFAULT(); const s=obj(saved);
  const o=Object.assign(d, s);
  o.modules=Object.assign(DEFAULT().modules, obj(s.modules));
  o.rhythm=Object.assign(DEFAULT().rhythm, obj(s.rhythm));
  o.groups=arr(s.groups).length?arr(s.groups).filter(g=>g&&g.id):DEFAULT().groups;
  ['spheres','goals','habits','tasks'].forEach(k=>o[k]=arr(s[k]).filter(Boolean));
  o.tasks.forEach(x=>{ if(x.kind==='wait'&&!String(x.who||'').trim()) x.kind='main'; });
  o.calendars=arr(s.calendars).filter(x=>typeof x==='string'); if(!o.calendars.length) o.calendars=['primary'];
  if(typeof o.remindCal!=='string') o.remindCal='primary';
  ['habitLog','days','affirm','life'].forEach(k=>o[k]=obj(s[k]));
  o.recur=arr(s.recur).filter(r=>r&&r.id&&r.title&&(arr(r.days).length||r.freq==='month'||r.freq==='year')).map(r=>Object.assign(r,{skip:obj(r.skip)}));
  o.briefPush=s.briefPush!==false;
  o.spheres.forEach(sp=>{ if(sp.color===undefined){ const n=String(sp.name||'').toLowerCase(); sp.color=/реактор/.test(n)?'#F2C94C':/контур/.test(n)?'#E5534B':/здоров|врач|личн|семь/.test(n)?'#4A90E2':''; } });
  o.chat=arr(s.chat).filter(m=>m&&m.content&&(m.role==='user'||m.role==='assistant')).slice(-20);
  o.tasks=o.tasks.filter(t=>t&&t.id&&t.title);
  if(!['clean','oldmoney'].includes(o.skin)) o.skin='clean';
  try{ fixCmdTitles(o); }catch(_){}
  return o;
}

function readLocal(){ try{ const t=localStorage.getItem('ritm-cache'); return t?JSON.parse(t):null; }catch(e){ return null; } }

let saveT=null;
function save(now){
  S.updatedAt=Date.now(); cacheLocal();
  clearTimeout(saveT); saveT=null;
  if(now) return flush();
  saveT=setTimeout(flush, 500);
}
async function flush(){
  clearTimeout(saveT); saveT=null;
  if(!cap.ref) return;
  saving=true;
  const body=JSON.parse(JSON.stringify(S));
  try{ await cap.ref.set(body); }
  catch(e){
    const c=e&&e.code;
    if(c==='quota_exceeded') announce('Хранилище заполнено. Убери старые выполненные дела в профиле.', true);
    else if(c==='unavailable'){ await new Promise(r=>setTimeout(r,1000+Math.random()*800)); try{ await cap.ref.set(body); }catch(e2){ announce('Не сохранилось. Проверь интернет — данные остались на этом устройстве.', true); } }
    else announce('Не сохранилось. Проверь интернет — данные остались на этом устройстве.', true);
  }
  saving=false;
}

const DOWN=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
function normRule(x){
  if(!x) return null;
  if(Array.isArray(x)){ const d=[...new Set(x.map(Number).filter(n=>n>=0&&n<=6))]; return d.length?{freq:'week',days:d}:null; }
  if(typeof x==='object'){
    if(x.freq==='month'){ const dom=Math.min(31,Math.max(1,Number(x.dom)||1)); return {freq:'month',dom,every:Math.max(1,Math.min(12,Number(x.every)||1))}; }
    if(x.freq==='year'){ const md=/^\d{2}-\d{2}$/.test(x.md||'')?x.md:null; return md?{freq:'year',md,before:Math.max(0,Math.min(30,Number(x.before)||0))}:null; }
    if(x.freq==='week'||Array.isArray(x.days)) return normRule(arr(x.days));
  }
  return null;
}
function repText(x){
  const r=normRule(x&&x.freq?x:(x&&x.days&&!x.freq?x.days:x)); if(!r) return '';
  if(r.freq==='month') return (r.every>1?(r.every===6?'раз в полгода':r.every===3?'раз в квартал':'раз в '+r.every+' мес.'):'каждый месяц')+', '+r.dom+'-го';
  if(r.freq==='year'){ const [m,d]=r.md.split('-').map(Number); return 'каждый год, '+d+' '+MONTHS[m-1]; }
  const d=r.days.slice().sort(); const k=d.join(); if(k==='0,1,2,3,4,5,6') return 'каждый день'; if(k==='1,2,3,4,5') return 'по будням'; if(k==='0,6') return 'по выходным'; return [1,2,3,4,5,6,0].filter(x=>d.includes(x)).map(x=>DOWN[x].toLowerCase()).join(', ');
}
const findRecur = id => arr(S.recur).find(r=>r.id===id);
const ruleOf = r => r ? normRule(r.freq&&r.freq!=='week'?r:(r.days||[])) : null;
function ruleMatch(rule, d, start){
  const [y,m,dd]=d.split('-').map(Number);
  if(rule.freq==='week') return rule.days.includes(new Date(y,m-1,dd).getDay());
  if(rule.freq==='month'){ const dim=new Date(y,m,0).getDate(); if(dd!==Math.min(rule.dom,dim)) return false; const [sy,sm]=(start||d).split('-').map(Number); const diff=(y-sy)*12+(m-sm); return diff>=0 && diff%rule.every===0; }
  if(rule.freq==='year') return d.slice(5)===rule.md || (rule.md==='02-29' && d.slice(5)==='02-28' && new Date(y,1,29).getMonth()!==1);
  return false;
}
function nextRepDay(rule, from){ rule=normRule(rule); if(!rule) return from; for(let i=0;i<400;i++){ const d=addDays(from,i); if(ruleMatch(rule,d,from)) return d; } return from; }
function nextOcc(r, from){ const rule=ruleOf(r); if(!rule) return null; for(let i=0;i<400;i++){ const d=addDays(from,i); if(r.start&&d<r.start&&rule.freq!=='year') continue; if(ruleMatch(rule,d,r.start)) return d; } return null; }
function ensureRecur(){
  if(!arr(S.recur).length) return false;
  const t=today(); let changed=false;
  const before=S.tasks.length;
  S.tasks=S.tasks.filter(x=>!(x.recurId && !x.done && x.due && x.due<t));
  if(S.tasks.length!==before) changed=true;
  const have=new Set(S.tasks.filter(x=>x.recurId).map(x=>x.recurId+'|'+(x.pre?'pre|':'')+x.due));
  for(const r of S.recur){
    const rule=ruleOf(r); if(!rule) continue;
    const H=rule.freq==='week'?14:60;
    for(let i=0;i<H;i++){
      const d=addDays(t,i); if(r.start && d<r.start && rule.freq!=='year') continue;
      if(!ruleMatch(rule,d,r.start)) continue;
      if(!r.skip[d] && !have.has(r.id+'|'+d)){
        S.tasks.push({id:uid(), title:r.title, note:r.note||null, sphere:r.sphere, due:d, time:r.time||null, kind:r.kind||'main', priority:r.priority||2, est:r.est||30, who:null, done:false, created:Date.now(), postponed:0, source:'recur', recurId:r.id});

      if(bf){ const pd=addDays(d,-bf); if(pd>=t && !have.has(r.id+'|pre|'+pd) && !r.skip['pre'+pd]){
        S.tasks.push({id:uid(), title:'Скоро: '+r.title+' ('+d.slice(8).replace(/^0/,'')+' '+MONTHS[Number(d.slice(5,7))-1]+')', note:'Через '+plural(bf,'день','дня','дней')+'. Подготовиться заранее: подарок, поздравление, документы.', sphere:r.sphere, due:pd, time:null, kind:'small', priority:2, est:15, who:null, done:false, created:Date.now(), postponed:0, source:'recur', recurId:r.id, pre:true});
        have.add(r.id+'|pre|'+pd); changed=true; } }
    }
  }
  S.recur.forEach(r=>Object.keys(r.skip).forEach(k=>{ if(k.replace(/^pre/,'')<t){ delete r.skip[k]; } }));

}
function makeRecur(t, rule){

const TASK_RULES='time — время "HH:MM", если названо конкретное время (встреча, звонок, «напомни в 15:00»), иначе null. «В 3», «в 4», «в 5» без слов «утра/ночи» — это дневное время 15:00, 16:00, 17:00. kind: main — важное дело; small — мелочь до 15 минут (оплатить, ответить, отправить, записаться); wait — ТОЛЬКО если другой человек должен что-то пользователю и назван по имени (who = кто). Если действие делает сам пользователь (съездить, получить, забрать, позвонить) — это main или small, не wait. priority: 1 высокий, 2 средний, 3 низкий. est — оценка в минутах. Даты вроде «завтра», «в пятницу», «до конца месяца» переведи в YYYY-MM-DD. Если срок не назван — null. Название задачи начинай с глагола. Ничего не склеивай, не теряй и не выдумывай.';

function fixWhen(x){ try{ const src=String(x.src||'').trim(); if(!src) return; const p=parseRu(src); if(p.due){ x.due=p.due; } if(p.time){ x.time=p.time; x.keepTime=1; } if(p.due&&!p.time&&x.time&&!/\d|утр|вечер|днём|днем|обед/i.test(src)) x.time=null; }catch(_){} }
/* ищем, где в исходной фразе начинается каждое дело, и берём кусок до начала следующего — там его дата и время */
function segWhen(list, text){
  try{
    const low=String(text||'').toLowerCase().replace(/ё/g,'е');
    const stem=w=>w.replace(/ё/g,'е').toLowerCase().replace(/[^а-яa-z0-9]/g,'').slice(0,5);
    const pos=list.map(x=>{ const src=String(x.src||'').toLowerCase().replace(/ё/g,'е').trim();
      if(src){ const k=low.indexOf(src.slice(0,Math.min(18,src.length))); if(k>=0) return k; }
      const ws=String(x.title||'').split(/\s+/).map(stem).filter(w=>w.length>=4);
      let best=-1; for(const w of ws){ const k=low.indexOf(w); if(k>=0 && (best<0||k<best)) best=k; } return best; });
    const idx=list.map((x,i)=>i).filter(i=>pos[i]>=0).sort((a,b)=>pos[a]-pos[b]);
    let prevDue=null;
    idx.forEach((i,j)=>{ const end=j+1<idx.length?pos[idx[j+1]]:low.length; const seg=String(text).slice(pos[i],end); const x=list[i];
      if(!x.src || !parseRu(x.src).due && !parseRu(x.src).time){ x.src=seg; }
      // «…, потом заехать в МВД» — тот же день, что и предыдущее дело
      const before=low.slice(Math.max(0,pos[i]-14),pos[i]);
      const pr=parseRu(x.src); if(!pr.due && prevDue && (/(потом|затем|после этого|после|а ещё|а еще|и ещё|и еще)\s*$/.test(before.trim()+' ') || /^\s*(а\s+)?(потом|затем|после этого|после)\s/i.test(String(x.src||''))) ){ x.due=prevDue; x._inh=1; }
      fixWhen(x); if(x._inh && !pr.due) x.due=prevDue;
      prevDue=x.due||prevDue; });
  }catch(_){ list.forEach(fixWhen); }
  return list;
}

function md(t){
  t=String(t||'').replace(/<br\s*\/?>/gi,'\n').replace(/[\u0030-\u0039]\uFE0F?\u20E3/g,m=>m[0]+'.').replace(/^\s*\|?[-:| ]{6,}\|?\s*$/gm,'').replace(/^\s*-{3,}\s*$/gm,'').replace(/^\s*\|(.*)\|\s*$/gm,(m,a)=>a.split('|').map(x=>x.trim()).filter(Boolean).join(' · '));
  return String(t||'').split('\n').map(line=>{
    let l=esc(line).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|\s)\*(\S[^*]*\S|\S)\*(?=\s|$)/g,'$1<i>$2</i>');
    if(/^#{1,4}\s/.test(line)) return '<b>'+l.replace(/^#{1,4}\s/,'')+'</b>';
    if(/^\s*[-*•]\s+/.test(line)) return '<span class="md-li">'+l.replace(/^\s*[-*•]\s+/,'')+'</span>';
    return l;
  }).join('\n');
}

/* свайп влево по делу: перенести / удалить */
(function(){
  let cur=null, sx=0, sy=0, dx=0, mode=null, open=null;
  const W=176;
  function closeOpen(){ if(open){ open.querySelector('.task').style.transform=''; open.classList.remove('open'); open=null; } }
  document.addEventListener('pointerdown', e=>{
    const sw=e.target.closest&&e.target.closest('.sw'); 
    if(open && (!sw || sw!==open)) { if(!(e.target.closest&&e.target.closest('.sw-act'))) closeOpen(); }
    if(!sw || e.target.closest('.sw-act')) return;
    cur=sw; sx=e.clientX; sy=e.clientY; dx=0; mode=null;
  }, {passive:true});
  document.addEventListener('pointermove', e=>{
    if(!cur) return;
    const mx=e.clientX-sx, my=e.clientY-sy;
    if(!mode){ if(Math.abs(mx)>10 && Math.abs(mx)>Math.abs(my)*1.3) mode='x'; else if(Math.abs(my)>10) { cur=null; return; } else return; }
    dx=Math.max(-W-30, Math.min(0, mx + (cur===open?-W:0)));
    const t=cur.querySelector('.task'); t.style.transition='none'; t.style.transform='translateX('+dx+'px)';
  }, {passive:true});
  function end(){
    if(!cur) return; const sw=cur; cur=null; const t=sw.querySelector('.task'); t.style.transition='';
    if(mode!=='x'){ return; }
    window.__ritmSwipe=Date.now();
    if(dx<-60){ if(open&&open!==sw) closeOpen(); t.style.transform='translateX(-'+W+'px)'; sw.classList.add('open'); open=sw; }
    else { t.style.transform=''; sw.classList.remove('open'); if(open===sw) open=null; }
  }
  document.addEventListener('pointerup', end); document.addEventListener('pointercancel', end);

function viewTasksList(){
  const t=today(); const groups=[{id:'all',name:'Все'},...S.groups.filter(g=>g.id==='work'||g.id==='personal'||S.spheres.some(s=>s.group===g.id))];
  let list=S.tasks.slice();
  if(ui.group!=='all') list=list.filter(x=>groupOf(x)===ui.group);
  if(ui.sub) list=list.filter(x=>x.sphere===ui.sub);
  const f=ui.filter;
  if(f==='today') list=list.filter(x=>!x.done && x.due && x.due<=t);
  else if(f==='week') list=list.filter(x=>!x.done && x.due && x.due<=addDays(t,7));
  else if(f==='nodate') list=list.filter(x=>!x.done && !x.due);
  else if(f==='stuck') list=list.filter(isStuck);
  else if(f==='wait') list=list.filter(x=>!x.done && x.kind==='wait');
  else if(f==='done') list=list.filter(x=>x.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0)).slice(0,50);
  else list=list.filter(x=>!x.done);
  if(f!=='done') list.sort((a,b)=>String(a.due||'9999').localeCompare(String(b.due||'9999'))||rank(a,b));
  const subs = ui.group==='all'?[]:S.spheres.filter(s=>s.group===ui.group);
  const filters=[['all','Все открытые'],['today','Сегодня'],['week','7 дней'],['nodate','Без срока'],['wait','Жду ответа'],['stuck','Залипло'],['done','Сделано']];
  let h='<div class="stack" style="gap:16px"><h2 class="pg-h2">Все дела</h2>';
  h+='<div class="seg" role="group" aria-label="Вкладки">'+groups.map(g=>'<button data-act="group" data-v="'+esc(g.id)+'" aria-pressed="'+(ui.group===g.id)+'">'+esc(g.name)+'</button>').join('')+'<button data-act="group-add" aria-label="Добавить вкладку">+</button></div>';
  if(subs.length>1) h+='<div class="row wrap">'+['<button class="chip" data-act="sub" data-v="" aria-pressed="'+(!ui.sub)+'">Все сферы</button>'].concat(subs.map(s=>'<button class="chip" data-act="sub" data-v="'+esc(s.id)+'" aria-pressed="'+(ui.sub===s.id)+'">'+esc(s.name)+'</button>')).join('')+'</div>';
  h+='<div class="seg" role="group" aria-label="Фильтр">'+filters.map(([k,n])=>'<button data-act="filter" data-v="'+k+'" aria-pressed="'+(f===k)+'" style="min-height:36px;font-size:13px">'+n+'</button>').join('')+'</div>';
  h+='<section class="card">'+(list.length?list.map(taskRow).join(''):'<div class="empty">Здесь пусто. Надиктуй дело в строке внизу или нажми «+ Дело».</div>')+'</section>';
  return h+'<p class="muted" style="font-size:13px">Нажми на дело — изменить. Зажми или проведи влево — перенести или удалить. Стрелка справа — на завтра.</p></div>';
}

function lifeRows(list){

}
function datesBlock(){

  h+=ys.length?ys.map(({r,d})=>{ const [y,m,dd]=d.split('-').map(Number); const n=Math.round((new Date(y,m-1,dd)-new Date(T+'T00:00'))/86400000); return '<div class="habit"><div style="min-width:0;flex:1"><div style="font-weight:650">'+esc(r.title)+'</div><div class="muted" style="font-size:12.5px">'+dd+' '+MONTHS[m-1]+' · '+(n===0?'сегодня':n===1?'завтра':'через '+plural(n,'день','дня','дней'))+(r.before?' · напомню за '+plural(r.before,'день','дня','дней'):'')+'</div></div><button class="icon-btn" data-act="date-del" data-id="'+esc(r.id)+'" aria-label="Убрать дату: '+esc(r.title)+'">'+ICON.x+'</button></div>'; }).join(''):'<p class="muted" style="margin:0;font-size:14px">Дни рождения, годовщины, страховки, налоги. Ритм напомнит заранее и в сам день — каждый год.</p>';

function viewDyn(){
  const t=today(); const days=Array.from({length:7},(_,i)=>addDays(t,i-6));
  const doneBy=d=>S.tasks.filter(x=>x.done&&x.doneAt&&dstr(new Date(x.doneAt))===d).length;
  const vals=days.map(doneBy); const max=Math.max(3,...vals);
  const postW=days.reduce((a,d)=>a+((S.days[d]&&S.days[d].postponed)||0),0);
  const createdW=S.tasks.filter(x=>x.created && dstr(new Date(x.created))>=days[0]).length;
  const doneW=vals.reduce((a,b)=>a+b,0); const stuck=S.tasks.filter(isStuck);
  const MOOD=['','тяжело','так себе','нормально','хорошо','отлично'];
  const wd=d=>WDS[new Date(d+'T12:00').getDay()];
  const byGroup=S.groups.filter(g=>S.spheres.some(s=>s.group===g.id)).map(g=>({g, n:S.tasks.filter(x=>x.done&&x.doneAt&&dstr(new Date(x.doneAt))>=days[0]&&groupOf(x)===g.id).length, open:S.tasks.filter(x=>!x.done&&groupOf(x)===g.id).length}));
  let h='<div class="stack" style="gap:16px"><h1>Динамика</h1><p class="muted" style="margin:0">Последние 7 дней</p>';
  h+='<div class="grid2"><div class="card stat"><span class="eyebrow">Сделано</span><b>'+doneW+'</b></div><div class="card stat"><span class="eyebrow">Перенесено</span><b>'+postW+'</b></div><div class="card stat"><span class="eyebrow">Новых дел</span><b>'+createdW+'</b></div><div class="card stat"><span class="eyebrow">Залипло</span><b>'+stuck.length+'</b></div></div>';
  h+='<section class="card block"><h2 style="font-size:22px">Сделано по дням</h2><div class="bars" role="img" aria-label="Сделано по дням: '+days.map((d,i)=>wd(d)+' '+vals[i]).join(', ')+'">'+days.map((d,i)=>'<div class="bar"><b>'+vals[i]+'</b><i style="height:'+Math.round(vals[i]/max*100)+'%"></i><small>'+wd(d)+'</small></div>').join('')+'</div></section>';
  if(S.goals.length) h+=block('Цели', S.goals.map(g=>'<div class="goal" style="padding:4px 0">'+esc(g)+'</div>').join(''));
  h+=block('По вкладкам', byGroup.length?byGroup.map(x=>'<div class="habit"><span style="font-weight:600">'+esc(x.g.name)+'</span><span class="muted">сделано '+x.n+' · открыто '+x.open+'</span></div>').join(''):'<div class="empty">Пока нет данных.</div>');
  const moods=days.map(d=>S.days[d]&&S.days[d].mood);
  h+=block('Настроение', moods.some(Boolean)?'<div class="row wrap" style="gap:6px">'+days.map((d,i)=>'<span class="pill">'+wd(d)+': '+(moods[i]?MOOD[moods[i]]:'—')+'</span>').join('')+'</div>':'<div class="empty">Отмечай настроение при закрытии дня — здесь появится картина недели.</div>');
  h+=block('Привычки', S.habits.length?S.habits.map(hb=>'<div class="habit"><span style="font-weight:600">'+esc(hb.name)+'</span><span class="muted">'+days.filter(d=>S.habitLog[d]&&S.habitLog[d][hb.id]).length+' из 7 · серия '+streak(hb.id)+'</span></div>').join(''):'<div class="empty">Привычек пока нет. Добавь их в профиле.</div>');
  h+=block('Долгожители', stuck.length?stuck.map(taskRow).join('')+'<p class="muted" style="font-size:13px;margin:8px 0 0">Такие дела лучше разбить на шаги или честно удалить.</p>':'<div class="empty">Ничего не залипло.</div>');
  return h+'</div>';
}

function parseRu(src, now){

    else if((mm=s.match(/\s(по\sвыходным|в\sвыходные|каждые\sвыходные)\s/i))){ repeat=[0,6]; cut(mm[0]); }

    const d=Number(m[1]), mo=Number(m[2]); if(d>=1&&d<=31&&mo>=1&&mo<=12){ due=m[3]?(String(m[3]).length===2?'20'+m[3]:m[3])+'-'+pad(mo)+'-'+pad(d):futureDate(now,d,mo); cut(m[0]); }
  }

  if((m=s.match(/\s(?:в|к|на)\s(\d{1,2})[:.](\d{2})\s/i))||(m=s.match(/\s(\d{1,2}):(\d{2})\s/))||(m=s.match(/\s(?:в|к)\s(\d{1,2})\s([0-5]\d)\s(?!мин|час|раз|дн|недел|числ|этаж|кабинет|чел)/i))){ const h=Number(m[1]),mi=Number(m[2]); if(h<24&&mi<60){ time=pad(h)+':'+pad(mi); cut(m[0]); } }
  if(!time && (m=s.match(/\s(?:на|к|в)\s(\d{1,2})\s?(?:час(?:а|ов)?\s?)?(утра|вечера|ночи)\s/i))){ let h=Number(m[1]); const p=m[2].toLowerCase(); if(p==='вечера'&&h<12) h+=12; if(p==='ночи'&&h===12) h=0; if(h<24){ time=pad(h)+':00'; cut(m[0]); } }
  if(!time && (m=s.match(/\s(?:в|к)\s(\d{1,2}|[а-яё]+)\s?(?:час(?:а|ов)?\s?)?(утра|дня|вечера|ночи)?\s/i))){

const CMD_RE=/^\s*(?:пожалуйста\s+)?(удали|убери|вычеркни|сотри|отмени|перенеси|сдвинь|передвинь|отложи|отметь|выполнила|сделала|я\s+сделала|готово)(?=[\s,.!:]|$)/i;
const stem=w=>w.toLowerCase().replace(/ё/g,'е').replace(/[^а-яa-z0-9]/g,'').slice(0,5);
function localMatch(text){
  const words=text.replace(CMD_RE,' ').split(/\s+/).map(stem).filter(w=>w.length>=3&&!['задач','дело','дела','мне','надо','котор','завтр','сегод','все','всё'].includes(w));
  if(!words.length) return [];
  return S.tasks.filter(x=>!x.done).map(x=>{ const tw=x.title.split(/\s+/).map(stem); const sc=words.filter(w=>tw.some(t=>t&&t.startsWith(w.slice(0,4)))).length; return {x,sc}; }).filter(o=>o.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,5);
}

const delBtn = id => '<button class="btn danger block-btn" data-act="e-del" data-id="'+esc(id)+'">Удалить дело</button>';
function applyRepeat(t, rule){
  if(!t) return;
  rule=normRule(rule);
  const r=t.recurId&&findRecur(t.recurId); const T=today();
  if(!rule){
    if(r){ S.recur=S.recur.filter(x=>x.id!==r.id); S.tasks=S.tasks.filter(x=>!(x.recurId===r.id && !x.done && x.id!==t.id)); t.recurId=null; }
    return;
  }
  if(r){
    Object.assign(r,{title:t.title, note:t.note, sphere:t.sphere, time:t.time, kind:t.kind, priority:t.priority, est:t.est});
    delete r.freq; delete r.dom; delete r.every; delete r.md; delete r.before;
    if(rule.freq==='week') r.days=rule.days.slice(); else Object.assign(r, rule, {days:[]});
    S.tasks=S.tasks.filter(x=>{ if(x.recurId!==r.id||x.done||x.id===t.id) return true; return !x.pre && ruleMatch(rule, x.due, r.start); });
    S.tasks.forEach(x=>{ if(x.recurId===r.id && !x.done && x.id!==t.id && !x.pre){ x.title=t.title; x.note=t.note; x.sphere=t.sphere; x.time=t.time; x.kind=t.kind; } });
    if(!ruleMatch(rule, t.due||T, r.start)) t.due=nextRepDay(rule, T);
  } else {
    if(!t.due || t.due<T || !ruleMatch(rule, t.due, t.due)) t.due=nextRepDay(rule, T);
    const nr=makeRecur(t, rule); t.recurId=nr.id;
  }
  ensureRecur();
}

    case 'push-test': { b.disabled=true; try{ const n=await window.RITM_PUSH.test(); toast(n?'Отправила — уведомление придёт через пару секунд':'Не нашла телефон для уведомлений. Нажми «Включить напоминания» ещё раз.', null, !n); if(!n){ cap.pushState='off'; cap.push=false; render(); } }catch(e){ toast('Не получилось отправить. Попробуй ещё раз.', null, true); } b.disabled=false; break; }
    case 'conn-test': { const d=new Date(Date.now()+3*60000); const t={id:'test',title:'Проверка напоминания из Ритма',due:dstr(d),time:pad(d.getHours())+':'+pad(d.getMinutes())}; b.disabled=true; const prev=S.rhythm.remind; const input={summary:'‼️ '+t.title,startTime:t.due+'T'+t.time+':00',endTime:addMin(t.due,t.time,15),description:'Тест из Ритма. Можно удалить.',overrideReminders:[{method:'popup',minutes:1}]}; if(S.remindCal&&S.remindCal!=='primary') input.calendarId=S.remindCal; if(!cap.mcp){ toast('Google Календарь подключим следующим шагом.'); b.disabled=false; break; } try{ await cap.mcp.callTool('Google Calendar','create_event',input,{cache:false}); toast('Тестовое событие на '+t.time+' создано. Уведомление придёт через ~2 минуты.', null, true); }catch(err){ toast('Не получилось создать тест. Проверь подключение календаря.', null, true); } b.disabled=false; break; }
    case 'meeting': meetingSheet(); break;

    case 'm-pick': { const t=meet.res&&meet.res.tasks[Number(b.getAttribute('data-i'))]; if(t){ t._skip=!t._skip; meetingSheet(); } break; }

      openSheet('<div class="row between"><h2 id="sheet-h">Цвет: '+esc(s.name)+'</h2><button class="btn ghost" data-act="close-sheet">Закрыть</button></div><div class="palette">'+PALETTE.map(([c,n])=>'<button class="swatch" data-act="sph-color-set" data-i="'+i+'" data-v="'+c+'" aria-pressed="'+(s.color===c)+'" aria-label="'+n+'" style="background:'+c+'"></button>').join('')+'</div><button class="btn block-btn" data-act="sph-color-set" data-i="'+i+'" data-v="">Без цвета</button>'); break; }
    case 'sph-color-set': { const s=S.spheres[Number(b.getAttribute('data-i'))]; if(s){ s.color=v||''; save(); } closeSheet(); render(); break; }

    case 'rv-pick': { obCollect(); const t=D.tasks[Number(b.getAttribute('data-i'))]; if(t) t._skip=!t._skip; render(); break; }
  }
});

/* iPhone: после открытия из уведомления нижняя панель «слетает» вверх — переставляем её на место */
/* нижняя панель всегда прижата к низу видимой области (iPhone иногда «поднимает» fixed-элементы) */
function kbOpen(){ const a=document.activeElement; return !!(a && (a.tagName==='TEXTAREA' || (a.tagName==='INPUT' && !/^(checkbox|radio|button|range|time|date)$/.test(a.type)) || a.isContentEditable)); }
function pinDock(){
  const d=document.querySelector('#dock .dock'); if(!d) return;
  const vv=window.visualViewport; if(!vv || !kbOpen()){ d.style.top=''; d.style.bottom=''; return; }
  const h=d.offsetHeight||0; const top=Math.round(vv.offsetTop+vv.height-h);
  d.style.bottom='auto'; d.style.top=top+'px';
}
function fixDock(){ pinDock(); requestAnimationFrame(pinDock); [60,250,600,1200].forEach(t=>setTimeout(pinDock,t)); }
if(window.visualViewport){ window.visualViewport.addEventListener('resize', pinDock); window.visualViewport.addEventListener('scroll', pinDock); }
window.addEventListener('resize', pinDock);
document.body.addEventListener('scroll', pinDock, {passive:true});
/* iPhone: после закрытия клавиатуры страница иногда остаётся «сдвинутой» — возвращаем её на место */
function unshift(){ if(kbOpen()) return; if(window.scrollY||window.scrollX) window.scrollTo(0,0); fixDock(); }
document.addEventListener('focusout', ()=>{ setTimeout(unshift, 60); setTimeout(unshift, 350); });
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) setTimeout(unshift, 100); });
document.addEventListener('focusout', ()=>{ setTimeout(fixDock,50); });
document.addEventListener('focusin', ()=>{ setTimeout(fixDock,50); });
window.addEventListener('pageshow', fixDock);
try{ navigator.serviceWorker && navigator.serviceWorker.addEventListener('message', e=>{ if(e.data&&e.data.type==='resume'){ fixDock(); render(); } if(e.data&&e.data.type==='push'&&document.visibilityState==='visible'){ chime(); toast((e.data.title||'Ритм')+(e.data.body?' — '+e.data.body:'')); } }); }catch(_){}
let AC=null;
function chime(){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const t0=AC.currentTime; [[660,0],[990,0.12],[1320,0.24]].forEach(([f,dt])=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type='sine'; o.frequency.setValueAtTime(f,t0+dt); o.frequency.exponentialRampToValueAtTime(f*1.12,t0+dt+0.09); g.gain.setValueAtTime(0.0001,t0+dt); g.gain.exponentialRampToValueAtTime(0.25,t0+dt+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+dt+0.22); o.connect(g); g.connect(AC.destination); o.start(t0+dt); o.stop(t0+dt+0.25); }); haptic(); }catch(_){} }
window.addEventListener('focus', fixDock);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') fixDock(); });
window.addEventListener('orientationchange', fixDock);

const tmin = t => toMin(t.time);
function relTime(min){ if(min<=0) return 'сейчас'; if(min<60) return 'через '+min+' мин'; const h=Math.floor(min/60), m=min%60; return 'через '+h+' ч'+(m?' '+m+' мин':''); }

/* строка дела — тихая */
function row(t, opt){
  opt=opt||{};
  const id=esc(t.id), title=esc(t.title);
  const meta=[];
  if(opt.sphere){ const s=sphere(t.sphere); if(s) meta.push(esc(s.name)); }
  if(t.due && t.due<today() && !t.done) meta.push('<span class="over-t">'+esc(t.due===addDays(today(),-1)?'вчера':human(t.due))+'</span>');
  else if(opt.showDate && t.due) meta.push(esc(dayLabel(t.due)));
  if(t.kind==='wait') meta.push('жду от '+esc(t.who||'—'));
  if(t.recurId&&!t.pre){ const r=findRecur(t.recurId); if(r) meta.push(IC.repeat+' '+esc(repText(r))); }
  if(arr(t.steps).length){ const s=arr(t.steps); meta.push(IC.steps+' '+s.filter(x=>x.done).length+'/'+s.length); }
  if(t.reminded&&!t.done&&t.time) meta.push(IC.bell);
  if(t.note && !arr(t.steps).length) meta.push('<span class="nt">'+esc(String(t.note).replace(/\s*\n\s*-\s*/g,' · ').replace(/^-\s*/,'').replace(/\s+/g,' ').slice(0,70))+'</span>');
  return '<div class="sw" data-sw="'+id+'"><div class="sw-act" aria-hidden="true"><button tabindex="-1" data-act="later" data-id="'+id+'">Завтра</button><button tabindex="-1" class="del" data-act="sw-del" data-id="'+id+'">Удалить</button></div>'+
    '<div class="task r'+(t.done?' done':'')+'"><button class="check" data-act="done" data-id="'+id+'" aria-pressed="'+!!t.done+'" aria-label="'+(t.done?'Вернуть':'Сделано')+': '+title+'">'+(t.done?ICON.check:'')+'</button>'+
    (opt.time!==false&&t.time?'<span class="t-time">'+esc(t.time)+'</span>':'')+
    '<button class="task-main" data-act="mv-open" data-id="'+id+'"><span class="task-title">'+title+'</span>'+(meta.length?'<span class="meta">'+meta.join('<i class="sep">·</i>')+'</span>':'')+'</button></div></div>';
}
function section(title, inner, extra, cls){ return '<section class="grp'+(cls?' '+cls:'')+'"><div class="grp-h"><h3>'+title+'</h3>'+(extra||'')+'</div><div class="grp-b">'+inner+'</div></section>'; }

/* ---------- ИНТЕРФЕЙСЫ «СЕГОДНЯ»: Тёплый · Лента · Плитки · Чистый ---------- */
const IFACES=[['warm','Тёплый','кремовый, спокойный'],['flow','Лента дня','день по времени'],['tiles','Плитки','блоки, как виджеты'],['clean','Чистый','белый, как Things']];
function ifaceOf(){ return ['flow','tiles','clean'].includes(S.iface)?S.iface:'warm'; }
function dayData(){
  const d=new Date(), t=today(), nowM=d.getHours()*60+d.getMinutes();
  const open=S.tasks.filter(x=>!x.done&&x.kind!=='wait'&&x.due&&x.due<=t);
  const overdue=open.filter(x=>x.due<t).sort(rank);
  const todays=open.filter(x=>x.due===t);
  const doneT=S.tasks.filter(x=>x.done&&x.doneAt&&dstr(new Date(x.doneAt))===t&&x.kind!=='wait');
  const dIn=doneT.filter(x=>x.due&&x.due<=t);
  const timed=todays.concat(dIn.filter(x=>x.due===t)).filter(x=>x.time&&x.due===t).sort((a,b)=>a.time.localeCompare(b.time));
  const untimed=overdue.concat(todays.filter(x=>!x.time)).concat(dIn.filter(x=>!(x.time&&x.due===t)));
  const ord=(a,b)=>(a.done?1:0)-(b.done?1:0)||((a.due<t?0:1)-(b.due<t?0:1))||rank(a,b);
  const mains=untimed.filter(x=>x.kind!=='small').sort(ord), smalls=untimed.filter(x=>x.kind==='small').sort(ord);
  const waits=S.tasks.filter(x=>!x.done&&x.kind==='wait'&&x.due&&x.due<=addDays(t,1)).sort(rank);
  const total=todays.length+overdue.length+doneT.length;
  const openTimed=timed.filter(x=>!x.done);
  const cur=openTimed.find(x=>toMin(x.time)<=nowM&&toMin(x.time)+(x.est||30)>nowM);
  const next=openTimed.find(x=>toMin(x.time)>nowM);
  const focus=cur||next||mains.find(x=>!x.done)||smalls.find(x=>!x.done)||null;
  return {d,t,nowM,overdue,todays,doneT,timed,mains,smalls,waits,total,cur,next,focus,dn:doneT.length};
}
function hdrExtras(D){
  let h='';
  if(D.waits.length && S.modules.wait) h+=section('Жду ответа', D.waits.map(x=>row(x)).join(''));
  if(S.modules.habits && S.habits.length) h+=section('Каждый день', '<div class="habits">'+S.habits.map(hb=>{ const on=!!(S.habitLog[D.t]&&S.habitLog[D.t][hb.id]); return '<button class="hab'+(on?' on':'')+'" data-act="habit" data-id="'+esc(hb.id)+'" aria-pressed="'+on+'"><span class="hab-c">'+(on?ICON.check:'')+'</span>'+esc(hb.name)+'</button>'; }).join('')+'</div>', '<button class="link" data-act="hab-manage">Изменить</button>');
  if(D.nowM>=18*60 && S.modules.evening && !(S.days[D.t]&&S.days[D.t].closed)) h+='<button class="close-quiet" data-act="evening">Закрыть день'+((D.todays.length+D.overdue.length)?' · перенести остальное':'')+' '+IC.chev+'</button>';
  return h;
}

function sphName(x){ return ''; }
function fmtGap(m){ const h=Math.floor(m/60), mm=m%60; return (h?h+' ч':'')+(h&&mm?' ':'')+(mm?mm+' мин':''); }

function flowColor(x){ const i=Math.max(0,arr(S.spheres).findIndex(s=>s.id===x.sphere)); return FLOWC[i%FLOWC.length]; }

function weekStripHtml(){
  const st=weekStart(0), t=today();
  return '<div class="fl-week" role="group" aria-label="Неделя">'+[0,1,2,3,4,5,6].map(i=>{ const d=addDays(st,i); const [y,m,dd]=d.split('-').map(Number); const wd=new Date(y,m-1,dd).getDay(); const has=S.tasks.some(x=>!x.done&&x.due===d); return '<button class="fl-d'+(d===t?' on':'')+(d<t?' past':'')+'" data-act="day-open" data-v="'+d+'"><span>'+WDS[wd]+'</span><b>'+dd+'</b><i'+(has?' class="has"':'')+'></i></button>'; }).join('')+'</div>';

/* ---- B · Лента дня ---- */
function viewHomeFlow(){
  const D=dayData(); const t=D.t;
  let h='<div class="home iface-flow">';
  h+='<header class="fl-hd"><h1 tabindex="-1" id="page-h">'+WDS[D.d.getDay()][0].toUpperCase()+WDS[D.d.getDay()].slice(1)+', '+D.d.getDate()+' '+MONTHS[D.d.getMonth()].slice(0,3)+'</h1><span class="fl-cnt">'+(D.total?D.dn+' из '+D.total:'')+'</span></header>';
  h+=weekStripHtml();
  if(!D.timed.length && !D.mains.length && !D.smalls.length) h+='<div class="empty-state"><p class="es-t">День свободен</p><p class="muted">Скажи или напиши внизу, что хочешь сделать.</p></div>';
  if(D.timed.length){
    h+='<ol class="fl-line">';
    let prevEnd=null;
    D.timed.forEach(x=>{ const m=toMin(x.time), e=m+(x.est||30);
      if(prevEnd!=null && m-prevEnd>=45) h+='<li class="fl-gap">свободно '+fmtGap(m-prevEnd)+'</li>';
      const isNow=D.cur===x; const c=flowColor(x); const tall=Math.min(96,Math.max(56,(x.est||30)*1.1));
      h+='<li class="fl-it'+(x.done?' done':'')+'" data-drag="'+esc(x.id)+'"><span class="fl-t">'+esc(x.time)+'</span><span class="fl-cap" style="background:'+c+';height:'+tall+'px">'+FI[flowIcon(x)]+'</span><button class="fl-body" data-act="mv-open" data-id="'+esc(x.id)+'"><small>'+esc(x.time)+'–'+pad(Math.floor(e/60)%24)+':'+pad(e%60)+(isNow?' · <b>сейчас</b>':'')+'</small><span>'+esc(x.title)+'</span></button>'+chk(x,'fl-ck" style="--c:'+c)+'</li>';
      prevEnd=Math.max(prevEnd||0,e); });
    h+='</ol>';
  }
  const any=D.mains.concat(D.smalls);
  if(any.length) h+='<section class="fl-any"><div class="fl-any-h">В течение дня · '+any.filter(x=>!x.done).length+(D.overdue.length?'<button class="link" data-act="od-today">просроченное — на сегодня</button>':'')+'</div><div class="fl-chips">'+any.map(x=>'<span class="fl-chip'+(x.done?' done':'')+(x.due<t&&!x.done?' late':'')+'" data-drag="'+esc(x.id)+'">'+chk(x,'sm')+'<button data-act="mv-open" data-id="'+esc(x.id)+'">'+esc(x.title)+'</button></span>').join('')+'</div></section>';
  h+=hdrExtras(D);
  return h+'</div>';
}
/* ---- C · Плитки ---- */
function viewHomeTiles(){
  const D=dayData(); const t=D.t; const f=D.focus;
  let h='<div class="home iface-tiles">';
  h+='<header class="tl-hd"><h1 tabindex="-1" id="page-h">'+WD[D.d.getDay()][0].toUpperCase()+WD[D.d.getDay()].slice(1)+'</h1><div class="tl-sub">'+D.d.getDate()+' '+MONTHS[D.d.getMonth()]+' · '+greeting().toLowerCase()+(S.name?', '+esc(S.name):'')+'</div></header>';
  h+='<div class="tl-grid">';
  if(f){ const lab=D.cur===f?'Сейчас':(D.next===f?'Дальше · '+relTime(toMin(f.time)-D.nowM):'Начни с этого');
    let prog=''; if(D.cur===f){ const p=Math.round((D.nowM-toMin(f.time))/(f.est||30)*100); prog='<div class="tl-prog"><i style="width:'+Math.max(4,Math.min(100,p))+'%"></i></div>'; }
    h+='<section class="tl tl-focus wide"><div class="tl-top"><span>'+esc(lab)+'</span><span>'+(f.time?esc(f.time):esc(sphName(f)))+'</span></div><div class="tl-fr">'+chk(f,'big')+'<button class="tl-ft" data-act="mv-open" data-id="'+esc(f.id)+'">'+esc(f.title)+'</button></div>'+prog+'</section>'; }
  h+='<section class="tl tl-done"><span class="tl-l">Сделано</span><div><b>'+D.dn+'</b><span> из '+D.total+'</span></div></section>';
  const nx=D.timed.filter(x=>!x.done&&x!==f&&toMin(x.time)>D.nowM)[0];
  h+='<button class="tl tl-next" '+(nx?'data-act="mv-open" data-id="'+esc(nx.id)+'"':'data-act="cap-open"')+'><span class="tl-l">Дальше</span><div>'+(nx?'<small>'+esc(nx.time)+'</small><span>'+esc(nx.title)+'</span>':'<span class="muted">по времени дел больше нет</span>')+'</div></button>';
  const mains=D.mains.filter(x=>x!==f), timedRest=D.timed.filter(x=>x!==f&&x!==nx);
  const row2=x=>'<div class="tl-row'+(x.done?' done':'')+'" data-drag="'+esc(x.id)+'">'+chk(x)+'<button class="tl-rt" data-act="mv-open" data-id="'+esc(x.id)+'">'+(x.time?'<small>'+esc(x.time)+'</small> ':'')+esc(x.title)+'</button><span class="tl-rs'+(x.due<t&&!x.done?' late':'')+'">'+(x.due<t&&!x.done?'вчера':esc(sphName(x)))+'</span></div>';
  if(mains.length) h+='<section class="tl wide"><div class="tl-l">Главное'+(D.overdue.length?'<button class="link" data-act="od-today">всё на сегодня</button>':'')+'</div>'+mains.map(row2).join('')+'</section>';
  if(timedRest.length) h+='<section class="tl wide"><div class="tl-l">По времени</div>'+timedRest.map(row2).join('')+'</section>';
  const sm=D.smalls.filter(x=>x!==f);
  h+='<button class="tl tl-small" data-act="more-small"><span class="tl-l">Мелочи</span><b>'+sm.filter(x=>!x.done).length+'</b></button>';
  const ev=D.timed.filter(x=>!x.done&&toMin(x.time)>=18*60)[0];
  h+='<button class="tl tl-eve" '+(ev?'data-act="mv-open" data-id="'+esc(ev.id)+'"':'data-act="tab" data-v="tasks"')+'><span class="tl-l">Вечером</span><span>'+(ev?esc(ev.time)+' '+esc(ev.title):'свободно')+'</span></button>';
  if(ui.moreSmall && sm.length) h+='<section class="tl wide">'+sm.map(row2).join('')+'</section>';
  h+='</div>'+hdrExtras(D);
  return h+'</div>';
}
/* ---- D · Чистый ---- */
function viewHomeClean(){
  const D=dayData(); const t=D.t;
  const r=x=>'<div class="cl-row'+(x.done?' done':'')+'" data-drag="'+esc(x.id)+'">'+chk(x,'sq')+'<button class="cl-b" data-act="mv-open" data-id="'+esc(x.id)+'"><span>'+esc(x.title)+(x.due<t&&!x.done?' <em class="cl-late">вчера</em>':'')+'</span>'+((x.time&&x.due===t)||sphName(x)?'<small'+(D.cur===x?' class="now"':'')+'>'+[x.time&&x.due===t?x.time+(D.cur===x?' · сейчас':''):'',sphName(x)].filter(Boolean).map(esc).join(' · ')+'</small>':'')+'</button></div>';
  let h='<div class="home iface-clean">';
  h+='<header class="cl-hd"><div class="cl-t">'+FI.star+'<h1 tabindex="-1" id="page-h">Сегодня</h1></div><div class="cl-sub">'+WD[D.d.getDay()][0].toUpperCase()+WD[D.d.getDay()].slice(1)+', '+D.d.getDate()+' '+MONTHS[D.d.getMonth()]+(D.total?' · '+D.dn+' из '+D.total:'')+'</div></header>';
  if(!D.total) h+='<div class="empty-state"><p class="es-t">На сегодня пусто</p><p class="muted">Скажи или напиши внизу, что хочешь сделать.</p></div>';

  if(D.mains.length) h+='<section class="cl-sec"><h3>Главное'+(D.overdue.length?'<button class="link" data-act="od-today">всё на сегодня</button>':'')+'</h3>'+D.mains.map(r).join('')+'</section>';
  if(D.smalls.length) h+='<section class="cl-sec"><h3>Мелочи</h3>'+D.smalls.map(r).join('')+'</section>';

}
function ifacePicker(){

function viewHome(){
  { const f=ifaceOf(); if(f==='flow') return viewHomeFlow(); if(f==='tiles') return viewHomeTiles(); if(f==='clean') return viewHomeClean(); }
  const d=new Date(); const t=today(); const nowM=d.getHours()*60+d.getMinutes();
  const open=S.tasks.filter(x=>!x.done&&x.kind!=='wait'&&x.due&&x.due<=t);
  const overdue=open.filter(x=>x.due<t).sort(rank);
  const todays=open.filter(x=>x.due===t);
  const evening=todays.filter(x=>x.time&&toMin(x.time)>=18*60).sort((a,b)=>a.time.localeCompare(b.time));
  const timed=todays.filter(x=>x.time&&toMin(x.time)<18*60).sort((a,b)=>a.time.localeCompare(b.time));
  const untimed=todays.filter(x=>!x.time);
  const mains=untimed.filter(x=>x.kind==='main').sort(rank), smalls=untimed.filter(x=>x.kind==='small').sort(rank);
  const waits=S.tasks.filter(x=>!x.done&&x.kind==='wait'&&x.due&&x.due<=addDays(t,1)).sort(rank);
  const doneT=S.tasks.filter(x=>x.done&&x.doneAt&&dstr(new Date(x.doneAt))===t&&x.kind!=='wait');
  const dIn=doneT.filter(x=>x.due===t||(x.due&&x.due<t));
  const total=todays.length+overdue.length+doneT.length;
  const rv=toMin(S.rhythm.review); const isEve=rv!=null&&nowM>=rv;
  let h='<div class="home">';
  // шапка
  h+='<header class="hd"><div class="hd-date">'+WD[d.getDay()]+', '+d.getDate()+' '+MONTHS[d.getMonth()]+(total?' · сделано '+doneT.length+' из '+total:'')+'</div><h1 tabindex="-1" id="page-h">'+greeting()+(S.name?', '+esc(S.name):'')+'</h1>'+
     (S.modules.affirm?'<button class="hd-line" data-act="affirm-new" aria-label="Другая фраза дня">'+esc(affirmation())+'</button>':'')+'</header>';
  // сейчас / дальше
  const next=timed.concat(evening).find(x=>toMin(x.time)+((x.est||30))>nowM);
  const focus=next || mains[0] || smalls[0];
  const nf=a=>{ if(!focus) return; const k=a.indexOf(focus); if(k>=0) a.splice(k,1); }; [timed,evening,mains,smalls].forEach(nf);
  dIn.forEach(x=>{ if(x.time&&x.due===t){ (toMin(x.time)>=18*60?evening:timed).push(x); } else (x.kind==='small'?smalls:mains).push(x); });
  [timed,evening].forEach(a=>a.sort((p,q)=>p.time.localeCompare(q.time))); [mains,smalls].forEach(a=>a.sort((p,q)=>(p.done?1:0)-(q.done?1:0)||rank(p,q)));
  if(focus){
    const isNow=next&&toMin(next.time)<=nowM;
    const label=next?(isNow?'Сейчас':'Дальше · '+relTime(toMin(next.time)-nowM)):'Начни с этого';
    h+='<section class="now"><div class="now-l">'+esc(label)+'</div><div class="now-r"><button class="check big" data-act="done" data-id="'+esc(focus.id)+'" aria-label="Сделано: '+esc(focus.title)+'"></button><button class="now-t" data-act="mv-open" data-id="'+esc(focus.id)+'">'+(next?'<b>'+esc(next.time)+'</b> ':'')+esc(focus.title)+'</button></div></section>';
  }
  if(!total && !waits.length){
    h+='<div class="empty-state"><p class="es-t">День свободен</p><p class="muted">Скажи или напиши внизу, что хочешь сделать.</p>'+(S.tasks.some(x=>!x.done&&!x.due)?'<button class="btn" data-act="tab" data-v="tasks">Взять из входящих</button>':'')+'</div>';
  }
  const cnt='';
  if(overdue.length) h+=section('С прошлых дней', overdue.map(x=>row(x,{showDate:true})).join(''), '<button class="link" data-act="od-today">Всё на сегодня</button>', 'od');
  if(timed.length) h+=section('По времени', timed.map(x=>row(x)).join(''), cnt);
  if(mains.length){ const top=mains.slice(0,3), rest=mains.slice(3); h+=section('Главное', top.map(x=>row(x)).join('')+(rest.length?(ui.moreMain?rest.map(x=>row(x)).join(''):'<button class="more" data-act="more-main">Ещё '+rest.length+'</button>'):''), timed.length?'':cnt); }
  if(smalls.length) h+=section('Мелочи', ui.moreSmall||smalls.length<=2?smalls.map(x=>row(x)).join(''):'<button class="more" data-act="more-small">'+plural(smalls.length,'мелочь','мелочи','мелочей')+' — показать</button>', (!timed.length&&!mains.length)?cnt:'');
  if(evening.length) h+=section('Вечером', evening.map(x=>row(x)).join(''));
  if(waits.length && S.modules.wait) h+=section('Жду ответа', waits.map(x=>row(x)).join(''));
  // каждый день
  if(S.modules.habits && S.habits.length){
    h+=section('Каждый день', '<div class="habits">'+S.habits.map(hb=>{ const on=!!(S.habitLog[t]&&S.habitLog[t][hb.id]); return '<button class="hab'+(on?' on':'')+'" data-act="habit" data-id="'+esc(hb.id)+'" aria-pressed="'+on+'"><span class="hab-c">'+(on?ICON.check:'')+'</span>'+esc(hb.name)+'</button>'; }).join('')+'</div>', '<button class="link" data-act="hab-manage">Изменить</button>');
  }
  const doneOther=doneT.filter(x=>!dIn.includes(x));
  if(doneOther.length) h+=section('Сделано', ui.moreDone?doneOther.map(x=>row(x)).join(''):'<button class="more" data-act="more-done">'+plural(doneOther.length,'дело','дела','дел')+' — показать</button>', '', 'done-grp');
  if(isEve && S.modules.evening && !(S.days[t]&&S.days[t].closed)) h+='<button class="close-quiet" data-act="evening">Закрыть день'+((todays.length+overdue.length)?' · перенести остальное':'')+' '+IC.chev+'</button>';
  return h+'</div>';
}

/* ---------- НЕДЕЛЯ (повестка) ---------- */

  const tv=ui.tview==='month'||ui.tview==='day'||ui.tview==='list'?ui.tview:'week';
  const fOk=()=>true;
  let h='<div class="plan">';
  if(tv==='day'){
    h+='<div class="topbar"><button class="back" data-act="tview" data-v="week">'+IC.back+'<span>Неделя</span></button></div>';
    return h+viewDayPage(ui.day||today())+'</div>';
  }
  if(tv==='list'){ h+='<div class="topbar"><button class="back" data-act="tview" data-v="week">'+IC.back+'<span>Неделя</span></button></div>'; return h+viewTasksList()+'</div>'; }
  if(tv==='month'){
    h+='<div class="topbar"><button class="back" data-act="tview" data-v="week">'+IC.back+'<span>Неделя</span></button></div>';
    h+=viewMonth(false);
    return h+'</div>';
