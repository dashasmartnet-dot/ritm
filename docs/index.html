  rec.onresult=e=>{ if(voice.rec!==rec) return; let interim=''; for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal) finalTxt+=r[0].transcript+' '; else interim+=r[0].transcript; } fieldSet(id,(finalTxt+interim).trim()); if(id==='chat-in'&&talk.on){ clearTimeout(voice.sil); voice.sil=setTimeout(()=>{ if(voice.rec===rec){ try{ rec.stop(); }catch(_){} } }, 1500); } };
  rec.onerror=e=>{ const c=e&&e.error; if(c==='no-speech'||c==='aborted') return;
    if((c==='not-allowed'||c==='service-not-allowed') && window.RITM_TRANSCRIBE && !inFrame){ voice.rec=null; startRecorder(id); return; }
    micFail(c==='not-allowed'||c==='service-not-allowed'?(inFrame?'Здесь запись недоступна. Нажми на поле и на микрофон на клавиатуре iPhone.':'Микрофон выключен для Ритма. Открой Настройки iPhone → Приложения → Safari → Микрофон → «Разрешить», потом закрой и открой Ритм.'):'Не получилось распознать речь. Попробуй ещё раз.'); };
  rec.onend=()=>{ if(voice.id===id && voice.rec===rec) voiceDone(); };
  voice.rec=rec; voice.id=id; setMicUI();
  try{ rec.start(); }catch(e){ micFail('Не получилось включить микрофон.'); }
}
const IS_IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
/* Whisper иногда «слышит» в тишине фразы из субтитров — выбрасываем их */
const HALLU=/субтитр|dimatorzok|продолжение следует|спасибо за просмотр|подписывайтесь|редактор|корректор|аплодисмент|музыка\]|\[музыка|смех\]/i;
function cleanStt(t){ t=String(t||'').trim(); if(!t||HALLU.test(t)) return ''; return t; }
async function startRecorder(id){
  let stream;
  try{ stream=await getMic(); }
  catch(e){ try{ console.warn('mic',e&&e.name,e&&e.message); }catch(_){} micFail(inFrame?'Здесь запись недоступна. Нажми на поле и на микрофон на клавиатуре iPhone.':'Микрофон выключен для Ритма. Открой Настройки iPhone → Приложения → Safari → Микрофон → «Разрешить», потом закрой и открой Ритм.'); return; }
  try{
    const mime=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))||'';
    const mr=new MediaRecorder(stream, mime?{mimeType:mime}:undefined); voice.chunks=[];
    const quiet=id==='chat-in'?1500:2500;
    const watch=levelWatch(mr, quiet, id==='chat-in'?8000:10000, ['dump-reply','ob-story','m-text','life-in'].includes(id)?300000:120000);
    mr.ondataavailable=e=>{ if(e.data&&e.data.size) voice.chunks.push(e.data); };
    mr.onstop=async()=>{
      const b=document.querySelector('[data-mic-for="'+id+'"]');
      if(voice.cancel){ voice.cancel=false; voice.chunks=[]; voiceDone(); return; }
      if(!watch.spoke){ voice.chunks=[]; if(!(id==='chat-in'&&talk.on)) toast('Не услышала. Нажми на микрофон и говори.'); voiceDone(); return; }
      const blob=new Blob(voice.chunks,{type:mr.mimeType||'audio/mp4'});
      if(b){ b.disabled=true; b.innerHTML='<span class="spin"></span>'; b.setAttribute('aria-label','Распознаю'); }
      try{ const text=cleanStt(await window.RITM_TRANSCRIBE(blob)); if(text) fieldSet(id,text); else if(!(id==='chat-in'&&talk.on)) toast('Не разобрала слова. Скажи ещё раз чуть громче.'); }
      catch(e){ toast('Не получилось распознать запись. Проверь интернет и попробуй ещё раз.', null, true); }
      if(b){ b.disabled=false; delete b.dataset.st; } voiceDone(); };
    voice.media=mr; voice.rec=null; voice.id=id; setMicUI(); mr.start(1000);
  }catch(e){ try{ console.warn('rec',e&&e.name,e&&e.message); }catch(_){} micFail('Не получилось включить запись. Закрой и открой Ритм.'); }
}
/* один поток микрофона на весь запуск: iPhone спрашивает разрешение один раз, а не при каждом нажатии */
let micStream=null, micAC=null, micAn=null, micSrcFor=null;
async function getMic(){
  if(micStream && micStream.getAudioTracks().some(t=>t.readyState==='live')) return micStream;
  micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  return micStream;
}
function micRelease(){ if(micStream){ try{ micStream.getTracks().forEach(t=>t.stop()); }catch(_){} } micStream=null; }
const isStandalone=(()=>{ try{ return !!(navigator.standalone||matchMedia('(display-mode: standalone)').matches); }catch(_){ return false; } })();
/* уровень звука: один AudioContext на запуск (у iPhone их число ограничено) */
function levelWatch(mr, quietMs, noSpeechMs, maxMs){
  const st={spoke:false};
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) { st.spoke=true; return st; }
    if(!micAC){ micAC=new AC(); }
    if(micAC.state==='suspended') micAC.resume().catch(()=>{});
    if(micSrcFor!==micStream){ micAn=micAC.createAnalyser(); micAn.fftSize=512; micAC.createMediaStreamSource(micStream).connect(micAn); micSrcFor=micStream; }
    const buf=new Uint8Array(micAn.fftSize); const t0=Date.now(); let quietSince=t0, live=false;
    const iv=setInterval(()=>{ if(mr.state!=='recording'){ clearInterval(iv); return; }
      const now=Date.now(); let m=0;
      if(micAC.state==='running'){ micAn.getByteTimeDomainData(buf); for(const v of buf) m=Math.max(m,Math.abs(v-128)); if(m>0) live=true; }
      if(m>9){ st.spoke=true; quietSince=now; }
      const b=document.querySelector('[data-mic-for="'+voice.id+'"]'); if(b) b.style.setProperty('--lvl', Math.min(1,m/60).toFixed(2));
      if(!live && now-t0>1500){ st.spoke=true; st.blind=true; }   // анализ звука недоступен — останавливаем только по кнопке или по максимуму
      const stop=(!st.blind && st.spoke && now-quietSince>quietMs) || (!st.blind && !st.spoke && now-t0>noSpeechMs) || now-t0>maxMs;
      if(stop){ clearInterval(iv); try{ mr.stop(); }catch(_){} }
    }, 80);
  }catch(_){ st.spoke=true; }
  return st;
}
function stopSR(){
  const rec=voice.rec; voice.rec=null;
  try{ rec.stop(); }catch(e){}
  setTimeout(()=>{ try{ rec.abort(); }catch(e){} }, 400);
  voiceDone();
}
/* одно разрешение на запуск: сначала получаем доступ к микрофону (iPhone спрашивает один раз),
   сразу отпускаем его, а распознавание речи дальше работает по уже выданному разрешению */
let micGrant=null, micOk=false;
function micWarm(){
  if(micGrant) return micGrant;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) return Promise.resolve(false);
  micGrant=navigator.mediaDevices.getUserMedia({audio:true}).then(st=>{ try{ st.getTracks().forEach(t=>t.stop()); }catch(_){} micOk=true; return true; }).catch(e=>{ micGrant=null; return false; });
  return micGrant;
}
window.__ritmMic=()=>({ac:micAC&&micAC.state, live:!!(micStream&&micStream.getAudioTracks().some(t=>t.readyState==='live'))});
function acWarm(){ try{ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; if(!micAC) micAC=new AC(); if(micAC.state==='suspended') micAC.resume().catch(()=>{}); }catch(_){} }
function micToggle(id){
  acWarm();
  if(voice.id){ const same=voice.id===id; if(voice.rec){ stopSR(); } else if(voice.media){ voice.media.stop(); } if(same) return; }
  const el=document.getElementById(id); voice.base=el?el.value:''; voice.lastId=id;
  const canRec=!inFrame && window.RITM_TRANSCRIBE && navigator.mediaDevices && window.MediaRecorder;
  if(canRec && (IS_IOS || isStandalone || !SR || S.micRec)) startRecorder(id);
  else if(SR && !inFrame) startSR(id);
  else if(!inFrame && window.RITM_TRANSCRIBE && navigator.mediaDevices && window.MediaRecorder) startRecorder(id);
  else if(SR) startSR(id);
  else { if(el) el.focus(); toast('Нажми на микрофон на клавиатуре iPhone и говори.', null, true); }
}
document.addEventListener('click', e=>{ const b=e.target.closest&&e.target.closest('[data-mic-for]'); if(!b) return; e.preventDefault(); e.stopPropagation(); micToggle(b.getAttribute('data-mic-for')); }, true);
new MutationObserver(()=>ensureMics()).observe(document.body,{childList:true,subtree:true});
document.addEventListener('input', e=>{ if(e.target&&e.target.id==='chat-in'){ const el=e.target; el.style.height='auto'; el.style.height=Math.min(140,el.scrollHeight)+'px'; assist.draft=el.value; } });

(async function boot(){
  const C=window.claude;
  if(!C||!C.use){ return; }
  const got=await Promise.allSettled(['db','user','sample','mcp'].map(n=>C.use(n)));
  const [db,user,sample,mcp]=got.map(r=>r.status==='fulfilled'?r.value:null);
  cap.sample=sample||null; cap.mcp=mcp||null;
  if(window.RITM_PUSH){ try{ cap.pushState=await window.RITM_PUSH.state(); cap.push=cap.pushState==='on'; }catch(e){ cap.pushState='off'; } }
  let id=null; try{ id = user ? await user.id() : null; }catch(e){}
  try{ cap.profile = user && user.profile ? user.profile() : null; if(cap.profile && cap.profile.name && ui.D && !ui.D.name) ui.D.name=cap.profile.name; }catch(e){}
  if(db && id){
    try{ cap.ref=db.doc('data/users/'+id+'/state'); await pull(); }
    catch(e){ toast('Не удалось загрузить данные из аккаунта. Показываю сохранённые на этом устройстве.', null, true); }
  } else {
    toast('Синхронизация недоступна: данные сохранятся только на этом устройстве.', null, true);
  }
  if(!(ui.D && ui.ob>0)) render();
  if(S.onboarded) loadCalendar();
  if(S.onboarded) scheduleBrief();
  if(S.onboarded && (S.tourV||0)<3) setTimeout(()=>coach(0),900);
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='hidden'){ if(saveT) flush(); }
    else { pull(); if(S.onboarded) loadCalendar(); }
  });
  window.addEventListener('pagehide', ()=>{ if(saveT) flush(); });
})();
})();
