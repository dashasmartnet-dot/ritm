<style>
/* Layout: one narrow column like a paper planner; bottom tab bar; sheets slide up for editing. */
:root{
  --bg:#F7EFE8; --surface:#FFFFFF; --ink:#2E2522; --muted:#76665F; --accent:#8C4A3C; --accent-ink:#FFFFFF;
  --soft:#EED9CF; --line:#EADBD1; --good:#2F7A55; --warn:#A5541E;
  --display:'Cormorant Garamond', 'Times New Roman', serif; --body:'Manrope', -apple-system, 'Segoe UI', sans-serif;
  --radius:22px; color-scheme:light;
}
:root[data-skin="oldmoney"]{
  --bg:#F3EEE4; --surface:#FBF8F2; --ink:#14213D; --muted:#555B6C; --accent:#14213D; --accent-ink:#F3EEE4;
  --soft:#E6DCC6; --line:#DCD2C0; --good:#2D6A4F; --warn:#9A5B13; --radius:8px;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.app{max-width:560px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 150px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:600;text-wrap:balance;letter-spacing:0}
h1{font-size:40px;line-height:1}
h2{font-size:26px;line-height:1.1}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.card{background:var(--surface);border-radius:var(--radius);padding:16px 18px}
.block{display:flex;flex-direction:column;gap:8px}
.block-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.block-btn{width:100%;min-height:52px;font-size:16px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
:root[data-skin="oldmoney"] .btn{border-radius:6px}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
:root[data-skin="oldmoney"] .chip{border-radius:6px}
input[type=text],input[type=time],input[type=date],input[type=number],textarea,select{width:100%;box-sizing:border-box;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:46px}
textarea{min-height:110px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* tasks */
.task{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.check{width:28px;height:28px;flex:none;border-radius:50%;border:1.5px solid var(--muted);background:transparent;display:flex;align-items:center;justify-content:center;padding:0;margin-top:1px}
:root[data-skin="oldmoney"] .check{border-radius:4px}
.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.task-main{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}
.task-title{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.task.done .task-title{text-decoration:line-through;color:var(--muted)}
.meta{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.tag{display:inline-flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
.dot.work{background:var(--accent)} .dot.personal{background:#B98A6A} .dot.custom{background:var(--muted)}
.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--ink);white-space:nowrap}
.pill.warn{background:#F6E1CF;color:var(--warn)}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}

/* hero */
.hello{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.affirm{background:var(--soft);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.affirm p{margin:0;font-family:var(--display);font-style:italic;font-size:23px;line-height:1.2}
:root[data-skin="oldmoney"] .affirm{background:var(--ink);color:var(--bg)}
:root[data-skin="oldmoney"] .affirm .eyebrow{color:#C9B37E}
.banner{border:1px solid var(--warn);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.workbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.toggle{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px}
.toggle[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.event{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.event:last-child{border-bottom:0}
.event time{font-family:var(--display);font-size:20px;font-weight:600;width:56px;flex:none;font-variant-numeric:tabular-nums}
.habit{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

/* segmented */
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
:root[data-skin="oldmoney"] .seg button{border-radius:6px}

/* bottom */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(to top, var(--bg) 70%, transparent);padding:10px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.dock-inner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.capture{display:flex;gap:8px;align-items:center}
.capture input{border-radius:999px;min-height:50px}
.capture .go{width:50px;height:50px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);flex:none;display:flex;align-items:center;justify-content:center}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border-radius:18px;padding:4px;border:1px solid var(--line)}
.tabs button{min-height:46px;border:0;background:transparent;border-radius:14px;font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabs button[aria-current="page"]{color:var(--ink);background:var(--soft)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,16,14,.35);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:24px 24px 0 0;max-height:88%;overflow-y:auto;padding:18px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.sheet-inner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom, 0px));z-index:50;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:14px;font-weight:600;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.toast button{background:none;border:0;color:inherit;text-decoration:underline;font-weight:700;padding:6px}

/* onboarding */
.ob{min-height:calc(100% - 40px);display:flex;flex-direction:column;gap:18px;padding-top:12px}
.progress{display:flex;gap:5px}
.progress span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress span.on{background:var(--accent)}
.skin-card{border:2px solid var(--line);border-radius:20px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.skin-card[aria-pressed="true"]{border-color:var(--ink)}
.swatches{display:flex;gap:6px}
.swatches i{width:22px;height:22px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.08)}

/* dynamics */
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:140px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.bar i{display:block;width:100%;max-width:28px;border-radius:6px 6px 2px 2px;background:var(--accent);min-height:3px}
.bar small{font-size:11px;color:var(--muted);font-weight:700}
.bar b{font-size:12px;font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:600}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.srt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
<style>
.voice{display:flex;flex-direction:column;gap:10px;background:var(--surface);border-radius:var(--radius);padding:16px}
.voice textarea{min-height:220px;font-size:16px;border:0;background:var(--bg)}
.mic-hint{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--muted)}
.mic-hint svg{flex:none;margin-top:1px;color:var(--accent)}
.prompts{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.prompts li{font-size:14px;padding-left:14px;position:relative}
.prompts li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.sph-row{display:flex;gap:8px;align-items:center}
.sph-row input{flex:1;min-width:0}
.live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.goal{font-family:var(--display);font-size:19px;line-height:1.25}


/* day strip */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;margin:0 -2px;scrollbar-width:none;scroll-snap-type:x proximity}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:54px;min-height:72px;border-radius:16px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;scroll-snap-align:start;padding:6px 0}
.day[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.d-wd{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.85}
.d-n{font-family:var(--display);font-size:24px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.d-c{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;opacity:.9}
.affirm-line{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.affirm-line p{margin:0;font-family:var(--display);font-style:italic;font-size:20px;line-height:1.25;color:var(--accent)}
:root[data-skin="oldmoney"] .affirm-line p{color:#8A6A2F}
.affirm-line .btn{min-height:44px;padding:0 10px;flex:none}
.sub-h{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}
/* accessibility fixes */
:root{--ctl:#8A7B74}
:root[data-skin="oldmoney"]{--ctl:#7D8294}
input[type=text],input[type=time],input[type=date],input[type=number],textarea,select{font-size:16px;border-color:var(--ctl)}
::placeholder{color:var(--muted);opacity:1}
.pill.warn{color:#8A4F0F}
.chip,.seg button,.toggle{min-height:44px}
.check{position:relative}
.check::after{content:"";position:absolute;inset:-8px}
.toast button{min-height:44px;min-width:44px}
.toast :focus-visible{outline-color:var(--bg)}
:root[data-skin="oldmoney"] .affirm :focus-visible{outline-color:#C9B37E}
.day:focus-visible{outline-offset:3px}
/* old money: consistent squared corners */
:root[data-skin="oldmoney"] input,:root[data-skin="oldmoney"] textarea,:root[data-skin="oldmoney"] select,:root[data-skin="oldmoney"] .tabs,:root[data-skin="oldmoney"] .tabs button,:root[data-skin="oldmoney"] .toast,:root[data-skin="oldmoney"] .skin-card,:root[data-skin="oldmoney"] .toggle,:root[data-skin="oldmoney"] .day,:root[data-skin="oldmoney"] .capture input,:root[data-skin="oldmoney"] .capture .go,:root[data-skin="oldmoney"] .pill{border-radius:6px}
:root[data-skin="oldmoney"] .sheet{border-radius:10px 10px 0 0}
:root[data-skin="oldmoney"] .card{box-shadow:inset 0 0 0 1px var(--line)}


/* diary */
.diary{list-style:none;margin:6px 0 0;padding:0;border-top:1px solid var(--line)}
.d-row{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;min-height:40px;border-bottom:1px dashed var(--line);position:relative}
.d-row.busy .d-h{color:var(--ink);font-weight:700}
.d-h{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:6px}
.d-cell{display:flex;flex-direction:column;gap:4px;padding:5px 0;min-width:0}
.d-item{border-radius:10px;padding:6px 10px;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
.d-item.event{background:var(--soft)}
.d-item.task{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--accent)}
.d-t{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
.d-title{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.d-sub{font-size:12px;color:var(--muted);width:100%}
.d-mark{font-size:11.5px;color:var(--muted);font-style:italic}
.d-row.now{background:linear-gradient(to right, var(--soft), transparent 70%)}
.d-now{position:absolute;right:0;top:6px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.d-allday{display:flex;gap:6px;flex-wrap:wrap}
:root[data-skin="oldmoney"] .d-item{border-radius:4px}
/* assistant */
.chat{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto;padding:2px}
.msg{padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.45;max-width:92%}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--bg);border-bottom-left-radius:4px}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:4px}
.life-row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.life-row:last-child{border-bottom:0}
.life-dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--ctl);flex:none}
.life-dot.on{background:var(--accent);border-color:var(--accent)}
.tabs button span{font-size:11px}
/* iOS: поля времени не вылезают за край */
.f{min-width:0}
input[type=time],input[type=date]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;display:block}
input::-webkit-date-and-time-value{text-align:left}
.mic-big{align-self:flex-start;display:inline-flex;gap:8px;align-items:center;min-height:48px;padding:0 20px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mic-round{width:50px;height:50px;border-radius:50%;border:1px solid var(--ctl);background:var(--surface);color:var(--accent);flex:none;display:flex;align-items:center;justify-content:center}
.mic-big.rec,.mic-round.rec{background:#B3261E;border-color:#B3261E;color:#fff;animation:micp 1.4s ease-in-out infinite}
.mic-dot{width:12px;height:12px;border-radius:3px;background:#fff;display:inline-block}
@keyframes micp{0%,100%{box-shadow:0 0 0 0 rgba(179,38,30,.45)}50%{box-shadow:0 0 0 10px rgba(179,38,30,0)}}
@media (prefers-reduced-motion:reduce){.mic-big.rec,.mic-round.rec{animation:none}}

function merge(saved){
  const d=DEFAULT(); const s=obj(saved);
  const o=Object.assign(d, s);
  o.modules=Object.assign(DEFAULT().modules, obj(s.modules));
  o.rhythm=Object.assign(DEFAULT().rhythm, obj(s.rhythm));
  o.groups=arr(s.groups).length?arr(s.groups).filter(g=>g&&g.id):DEFAULT().groups;
  ['spheres','goals','habits','tasks'].forEach(k=>o[k]=arr(s[k]).filter(Boolean));
  o.calendars=arr(s.calendars).filter(x=>typeof x==='string'); if(!o.calendars.length) o.calendars=['primary'];
  if(typeof o.remindCal!=='string') o.remindCal='primary';
  ['habitLog','days','affirm','life'].forEach(k=>o[k]=obj(s[k]));
  o.recur=arr(s.recur).filter(r=>r&&r.id&&r.title&&arr(r.days).length).map(r=>Object.assign(r,{skip:obj(r.skip)}));
  o.briefPush=s.briefPush!==false;
  o.spheres.forEach(sp=>{ if(sp.color===undefined){ const n=String(sp.name||'').toLowerCase(); sp.color=/реактор/.test(n)?'#F2C94C':/контур/.test(n)?'#E5534B':/здоров|врач|личн|семь/.test(n)?'#4A90E2':''; } });

  o.tasks=o.tasks.filter(t=>t&&t.id&&t.title);
  if(!['clean','oldmoney'].includes(o.skin)) o.skin='clean';
  return o;

const findRecur = id => arr(S.recur).find(r=>r.id===id);
function ensureRecur(){
  if(!arr(S.recur).length) return false;
  const t=today(); let changed=false;
  const before=S.tasks.length;
  S.tasks=S.tasks.filter(x=>!(x.recurId && !x.done && x.due && x.due<t));
  if(S.tasks.length!==before) changed=true;
  const have=new Set(S.tasks.filter(x=>x.recurId).map(x=>x.recurId+'|'+x.due));
  for(const r of S.recur){
    for(let i=0;i<14;i++){
      const d=addDays(t,i); if(r.start && d<r.start) continue;
      const [y,m,dd]=d.split('-').map(Number); if(!r.days.includes(new Date(y,m-1,dd).getDay())) continue;
      if(r.skip[d] || have.has(r.id+'|'+d)) continue;
      S.tasks.push({id:uid(), title:r.title, note:r.note||null, sphere:r.sphere, due:d, time:r.time||null, kind:r.kind||'main', priority:r.priority||2, est:r.est||30, who:null, done:false, created:Date.now(), postponed:0, source:'recur', recurId:r.id});
      have.add(r.id+'|'+d); changed=true;
    }
  }
  // старые отметки «пропустить» чистим
  S.recur.forEach(r=>Object.keys(r.skip).forEach(k=>{ if(k<t){ delete r.skip[k]; } }));
  return changed;
}

  return dateCtx()+'\nСферы (id: название, вкладка):\n'+S.spheres.map(s=>'- '+s.id+': '+s.name+' ('+groupName(s.group)+')').join('\n');
}
const TASK_RULES='time — время "HH:MM", если названо конкретное время (встреча, звонок, «напомни в 15:00»), иначе null. kind: main — важное дело; small — мелочь до 15 минут (оплатить, ответить, отправить, записаться); wait — кто-то другой должен что-то пользователю (who = кто). priority: 1 высокий, 2 средний, 3 низкий. est — оценка в минутах. Даты вроде «завтра», «в пятницу», «до конца месяца» переведи в YYYY-MM-DD. Если срок не назван — null. Название задачи начинай с глагола. Ничего не склеивай, не теряй и не выдумывай.';
function normTask(x, sphId){
  return { id:uid(), title:String(x.title).slice(0,200), sphere:sphId,
    due: /^\d{4}-\d{2}-\d{2}$/.test(x.due||'')?x.due:null,
    time: isHM(x.time)?x.time:null,
    kind: ['main','small','wait'].includes(x.kind)?x.kind:'main',
    who: x.who?String(x.who).slice(0,60):null,
    note: x.note?String(x.note).slice(0,1000):null,
    priority: [1,2,3].includes(Number(x.priority))?Number(x.priority):2,
    est: Math.max(5,Math.min(480,Number(x.est)||30)),
    done:false, created:Date.now(), postponed:0, source:'voice' };
}
async function aiTasks(text){
  const prompt = ctxBlock()+'\nСфера по умолчанию: '+(defaultSphere()||'нет')+
  (workActive()?'\nСейчас рабочий режим: если дело не явно личное (врач, семья, дом, покупки), ставь рабочую сферу.':'')+'\n\nПреврати надиктованный текст в задачи. Почти всегда это ОДНА задача: сформулируй её коротко, 3–8 слов, начиная с глагола, без лишних подробностей (подробности положи в note). Разделяй на несколько задач, только если явно названы разные дела. Если названа дата или день недели — обязательно поставь due. Ответь ТОЛЬКО JSON вида {"tasks":[{"title":"...","note":"подробности или null","sphere":"id сферы из списка","due":"YYYY-MM-DD или null","time":"HH:MM или null","kind":"main|small|wait","who":"имя или null","priority":2,"est":30}]}. '+TASK_RULES+'\n\nТекст:\n'+text.slice(0,12000);
  const r = await cap.sample.json(prompt,{modelTier:'quick',cache:false});
  return arr(r&&r.tasks).filter(x=>x&&x.title).map(x=>normTask(x, sphere(x.sphere)?x.sphere:defaultSphere()));
}
function aiError(e){
  const c=e&&e.code;
  if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(c)) return 'Помощник ИИ сейчас недоступен. Попробуй через минуту.';
  if(c==='rate_limited') return 'Слишком много запросов подряд. Попробуй через минуту.';
  if(c==='session_expired') return 'Нужно заново войти: открой Профиль → Выйти и войди по коду.';
  if(c==='prompt_too_large') return 'Слишком длинный текст. Сократи или раздели на части.';
  if(c==='invalid_json'||c==='empty_completion') return 'Не получилось разобрать ответ. Попробуй ещё раз.';
  if(c==='refused') return 'Помощник не стал разбирать этот текст. Перефразируй.';
  return 'Помощник не ответил. Попробуй ещё раз.';
}

/* ---------- toast & live ---------- */
let toastT=null;
function announce(msg, keep){ const l=$('#live'); if(l){ l.textContent=''; setTimeout(()=>l.textContent=msg,30); } toast(msg, null, keep); }
function toast(msg, undo, long){
  const l=$('#toast'); if(l) l.remove(); clearTimeout(toastT);
  const d=document.createElement('div'); d.className='toast'; d.id='toast'; d.setAttribute('role','status');
  const s=document.createElement('span'); s.textContent=msg; d.appendChild(s);
  if(undo){ const b=document.createElement('button'); b.type='button'; b.textContent='Отменить'; b.onclick=()=>{ try{undo();}catch(e){} d.remove(); }; d.appendChild(b); }
  document.body.appendChild(d);
  toastT=setTimeout(()=>d.remove(), undo?10000:(long?8000:5000));
}

function rhythmFields(R,p){
  const f=(k,l,type)=>'<label class="f" for="'+p+'-'+k+'">'+l+'<input id="'+p+'-'+k+'" data-rh="'+k+'" type="'+(type||'time')+'" value="'+esc(R[k])+'"'+(type==='number'?' min="1" max="16" inputmode="numeric"':'')+'></label>';
  return '<div class="grid2">'+f('wake','Подъём')+f('brief','Утренний план')+f('workStart','Работа с')+f('workEnd','Работа до')+f('review','Итоги дня')+f('sleep','Отбой')+f('focusHours','Часов на дела в день','number')+
  '<label class="f" for="'+p+'-remind">Напоминать до события<select id="'+p+'-remind" data-rh="remind">'+[15,30,60,120].map(v=>'<option value="'+v+'"'+(Number(R.remind)===v?' selected':'')+'>'+(v<60?v+' минут':v===60?'1 час':'2 часа')+'</option>').join('')+'</select></label></div>'+
  '<label class="row" style="gap:10px;font-weight:600"><input type="checkbox" data-rh="weekdaysOnly" '+(R.weekdaysOnly?'checked':'')+' style="width:22px;height:22px"> Рабочий режим только по будням</label>'+
  (R.note?'<p class="muted" style="font-size:13px;margin:0">'+esc(R.note)+'</p>':'');
}
function readRhythm(R){
  document.querySelectorAll('[data-rh]').forEach(el=>{
    const k=el.getAttribute('data-rh');
    if(el.type==='checkbox') R[k]=el.checked;
    else if(k==='focusHours'||k==='remind') R[k]=Math.max(1,Number(el.value)||R[k]);
    else if(el.value) R[k]=el.value;
  });
}

}

function systemPrompt(D, story, fix){
  const base='Человек надиктовал голосом рассказ о себе для личного ассистента-планировщика. '+dateCtx()+
  '\nСоставь его систему. Ответь ТОЛЬКО JSON:\n{"name":"имя или пустая строка","spheres":[{"name":"короткое название","group":"work|personal"}],"rhythm":{"wake":"HH:MM","brief":"HH:MM","workStart":"HH:MM","workEnd":"HH:MM","focusHours":5,"review":"HH:MM","sleep":"HH:MM","weekdaysOnly":true,"note":"1 предложение, почему такой ритм"},"habits":["до 6 коротких привычек"],"goals":["цели на 3 месяца своими словами человека"],"tasks":[{"title":"...","sphere":"ТОЧНОЕ название сферы из spheres","due":"YYYY-MM-DD|null","time":"HH:MM|null","kind":"main|small|wait","who":"имя|null","priority":2,"est":30}]}\n'+
  'Сферы: 3–8, каждая работа или крупный проект — отдельная рабочая сфера; личное раздели на понятные части (здоровье, документы и деньги, семья, дом, обучение), только если о них есть речь, иначе одна «Личное». Утренний план — через 30–60 минут после подъёма, итоги — за 1–3 часа до сна, focusHours — реалистичные часы на дела. Если о чём-то не сказано — разумные значения, но цели, привычки и задачи не выдумывай. '+TASK_RULES;
  let cur='';
  if(fix){ cur='\n\nТекущая система (JSON):\n'+JSON.stringify({name:D.name,spheres:D.spheres.map(s=>({name:s.name,group:s.group})),rhythm:D.rhythm,habits:D.habits,goals:D.goals,tasks:D.tasks.filter(t=>!t._skip).map(t=>({title:t.title,sphere:(D.spheres.find(s=>s.id===t.sphere)||{}).name,due:t.due,kind:t.kind,who:t.who,priority:t.priority,est:t.est}))})+'\n\nПоправки и дополнения человека (примени их к текущей системе, остальное сохрани как есть):\n'+fix.slice(0,6000); }
  return base+'\n\nРассказ:\n'+(story||'(пусто)').slice(0,20000)+cur;
}
async function obBuild(fix){
  const D=ui.D; obCollect();
  if(!fix && !D.story.trim()){ D.err='Расскажи хотя бы пару фраз о себе или выбери «Заполню сама».'; render(); return; }
  if(fix && !D.fix.trim()) return;
  if(!cap.sample){ D.err='Помощник ИИ недоступен на этой странице. Заполни вручную — это тоже быстро.'; if(!fix){ ui.ob=2; } render(); return; }
  D.busy=true; D.err=''; const token=++D.token; render();
  try{
    const r=await cap.sample.json(systemPrompt(D, D.story, fix?D.fix:''),{modelTier:'default',cache:false});
    if(token!==D.token || ui.D!==D) return;
    if(r && typeof r.name==='string' && r.name.trim()) D.name=r.name.trim().slice(0,40);
    const sph=arr(r&&r.spheres).filter(s=>s&&s.name).slice(0,10).map(s=>{ const old=D.spheres.find(o=>o.name.toLowerCase()===String(s.name).toLowerCase()); return {id:old?old.id:'s-'+uid(), name:String(s.name).slice(0,40), group:s.group==='work'?'work':'personal'}; });
    if(sph.length) D.spheres=sph;
    const R=obj(r&&r.rhythm); ['wake','brief','workStart','workEnd','review','sleep'].forEach(k=>{ if(isHM(R[k])) D.rhythm[k]=R[k]; });
    if(R.focusHours) D.rhythm.focusHours=Math.max(1,Math.min(16,Number(R.focusHours)||5));
    if(typeof R.weekdaysOnly==='boolean') D.rhythm.weekdaysOnly=R.weekdaysOnly;
    D.rhythm.note=R.note?String(R.note).slice(0,300):D.rhythm.note;
    if(Array.isArray(r&&r.habits)) D.habits=r.habits.map(String).filter(Boolean).slice(0,8);
    if(Array.isArray(r&&r.goals)) D.goals=r.goals.map(String).filter(Boolean).slice(0,6);
    if(Array.isArray(r&&r.tasks)){
      const byName=n=>D.spheres.find(s=>s.name.toLowerCase()===String(n||'').toLowerCase());
      const fallback=(D.spheres.find(s=>s.group==='personal')||D.spheres[0]||{}).id;
      D.tasks=r.tasks.filter(x=>x&&x.title).slice(0,60).map(x=>normTask(x,(byName(x.sphere)||{}).id||fallback));
    }
    D.built=true; if(fix) D.fix=''; ui.ob=2;
  }catch(e){ if(token!==D.token) return; D.err=aiError(e); }
  D.busy=false; render(); if(!fix) window.scrollTo(0,0);
}
function md(t){
  return String(t||'').split('\n').map(line=>{
    let l=esc(line).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|\s)\*(\S[^*]*\S|\S)\*(?=\s|$)/g,'$1<i>$2</i>');
    if(/^#{1,4}\s/.test(line)) return '<b>'+l.replace(/^#{1,4}\s/,'')+'</b>';
    if(/^\s*[-*•]\s+/.test(line)) return '<span class="md-li">'+l.replace(/^\s*[-*•]\s+/,'')+'</span>';
    return l;
  }).join('\n');
}

function moveTask(id, day){

}

/* свайп влево по делу: перенести / удалить */
(function(){
  let cur=null, sx=0, sy=0, dx=0, mode=null, open=null;
  const W=176;
  function closeOpen(){ if(open){ open.querySelector('.task').style.transform=''; open.classList.remove('open'); open=null; } }
  document.addEventListener('pointerdown', e=>{
    const sw=e.target.closest&&e.target.closest('.sw'); 
    if(open && (!sw || sw!==open)) { if(!(e.target.closest&&e.target.closest('.sw-act'))) closeOpen(); }
    if(!sw || e.target.closest('.sw-act')) return;
    cur=sw; sx=e.clientX; sy=e.clientY; dx=0; mode=null;
  }, {passive:true});
  document.addEventListener('pointermove', e=>{
    if(!cur) return;
    const mx=e.clientX-sx, my=e.clientY-sy;
    if(!mode){ if(Math.abs(mx)>10 && Math.abs(mx)>Math.abs(my)*1.3) mode='x'; else if(Math.abs(my)>10) { cur=null; return; } else return; }
    dx=Math.max(-W-30, Math.min(0, mx + (cur===open?-W:0)));
    const t=cur.querySelector('.task'); t.style.transition='none'; t.style.transform='translateX('+dx+'px)';
  }, {passive:true});
  function end(){
    if(!cur) return; const sw=cur; cur=null; const t=sw.querySelector('.task'); t.style.transition='';
    if(mode!=='x'){ return; }
    window.__ritmSwipe=Date.now();
    if(dx<-60){ if(open&&open!==sw) closeOpen(); t.style.transform='translateX(-'+W+'px)'; sw.classList.add('open'); open=sw; }
    else { t.style.transform=''; sw.classList.remove('open'); if(open===sw) open=null; }
  }
  document.addEventListener('pointerup', end); document.addEventListener('pointercancel', end);
  document.addEventListener('click', e=>{ if(window.__ritmSwipe && Date.now()-window.__ritmSwipe<350 && e.target.closest('.task')){ e.stopPropagation(); e.preventDefault(); } }, true);
})();
/* долгое нажатие на дело в списке → меню с «Удалить» */
(function(){
  let timer=null, sx=0, sy=0;
  document.addEventListener('pointerdown', e=>{
    const sw=e.target.closest&&e.target.closest('.sw'); if(!sw || e.target.closest('.check,.sw-act,.icon-btn')) return;
    sx=e.clientX; sy=e.clientY; clearTimeout(timer);
    timer=setTimeout(()=>{ timer=null; window.__ritmSwipe=Date.now()+300; haptic(); moveSheet(sw.getAttribute('data-sw')); }, 480);
  }, {passive:true});
  document.addEventListener('pointermove', e=>{ if(timer && (Math.abs(e.clientX-sx)>8||Math.abs(e.clientY-sy)>8)){ clearTimeout(timer); timer=null; } }, {passive:true});
  const stop=()=>{ clearTimeout(timer); timer=null; };
  document.addEventListener('pointerup', stop); document.addEventListener('pointercancel', stop);
  document.addEventListener('contextmenu', e=>{ if(e.target.closest&&e.target.closest('.sw,[data-drag]')) e.preventDefault(); });
})();
/* перетаскивание долгим нажатием */
(function(){
  let drag=null, timer=null, sx=0, sy=0;
  function clear(){ clearTimeout(timer); timer=null; }
  document.addEventListener('pointerdown', e=>{
    const li=e.target.closest&&e.target.closest('[data-drag]'); if(!li || e.target.closest('.check')) return;
    sx=e.clientX; sy=e.clientY; clear();
    timer=setTimeout(()=>{
      const r=li.getBoundingClientRect();
      const g=li.cloneNode(true); g.className+=' ghost'; g.style.width=r.width+'px'; g.style.left=r.left+'px'; g.style.top=r.top+'px'; document.body.appendChild(g);
      drag={id:li.getAttribute('data-drag'), g, dx:sx-r.left, dy:sy-r.top, over:null}; li.classList.add('lifted');
      haptic();
      document.body.classList.add('dragging');
    }, 350);
  }, {passive:true});
  document.addEventListener('pointermove', e=>{
    if(!drag){ if(timer && (Math.abs(e.clientX-sx)>8||Math.abs(e.clientY-sy)>8)) clear(); return; }
    e.preventDefault();
    drag.g.style.left=(e.clientX-drag.dx)+'px'; drag.g.style.top=(e.clientY-drag.dy)+'px';
    drag.g.style.display='none'; const el=document.elementFromPoint(e.clientX,e.clientY); drag.g.style.display='';
    const zone=el&&el.closest&&el.closest('[data-dropday]');

function parseActions(text){

  if(m){ try{ const j=JSON.parse(m[1].trim()); actions=arr(j).filter(a=>a&&['add','move','done','delete','repeat'].includes(a.op)).slice(0,20); }catch(e){} text=text.replace(m[0],'').trim(); }

  return {text, actions};
}
function actLabel(a){

  const when=(a.due?dayLabel(a.due):'')+(a.time?' в '+a.time:'');

}
function applyActions(list){
  let n=0; const added=[];
  list.forEach(a=>{
    const due=/^\d{4}-\d{2}-\d{2}$/.test(a.due||'')?a.due:null, time=isHM(a.time)?a.time:null;
    if(a.op==='add'){ const t=normTask({title:a.title,note:a.note,due,time,kind:a.kind||'main'}, defaultSphere()); t.source='assistant'; S.tasks.push(t); added.push(t); n++; return; }
    const t=findTask(a.id); if(!t) return;
    if(a.op==='move'){ const prev=t.due; t.due=due; if('time' in a) t.time=time; if(t.recurId&&prev&&prev!==due){ const r=findRecur(t.recurId); if(r) r.skip[prev]=true; t.recurId=null; } t.reminded=false; if(t.time) added.push(t); n++; }

}

  if(f==='today') list=list.filter(x=>!x.done && x.due && x.due<=t);
  else if(f==='week') list=list.filter(x=>!x.done && x.due && x.due<=addDays(t,7));

/* ---------- быстрый разбор русских дат и времени без ИИ ---------- */
const RU_MON={'янв':1,'фев':2,'мар':3,'апр':4,'мая':5,'май':5,'июн':6,'июл':7,'авг':8,'сен':9,'окт':10,'ноя':11,'дек':12};
const RU_DOW=[['воскресен','вс'],['понедельн','пн'],['вторник','вт'],['сред','ср'],['четверг','чт'],['пятниц','пт'],['суббот','сб']];
const RU_NUM={'один':1,'одну':1,'два':2,'две':2,'три':3,'четыре':4,'пять':5,'шесть':6,'семь':7,'восемь':8,'девять':9,'десять':10,'одиннадцать':11,'двенадцать':12};
function parseRu(src, now){
  now=now||new Date();
  let s=' '+String(src||'').replace(/([,!?;])/g,' $1 ').replace(/\.(?!\d)/g,' . ').replace(/\s+/g,' ').trim()+' ';
  const T=dstr(now); let due=null, time=null, repeat=null;
  const cut=re=>{ s=s.replace(re,' '); };
  // повтор: каждый день, по будням, по выходным, каждый понедельник, по вторникам и четвергам
  { let mm;
    if((mm=s.match(/\s(каждый\sдень|ежедневно|каждое\sутро|каждый\sвечер)\s/i))){ repeat=[0,1,2,3,4,5,6]; cut(mm[0]); }
    else if((mm=s.match(/\s(по\sбудням|в\sбудни|каждый\sбудний\sдень)\s/i))){ repeat=[1,2,3,4,5]; cut(mm[0]); }
    else if((mm=s.match(/\s(по\sвыходным|в\sвыходные|каждые\sвыходные)\s/i))){ repeat=[0,6]; cut(mm[0]); }
    else {
      const DOWRE=['воскресень','понедельник','вторник','сред','четверг','пятниц','суббот'];
      const m2=s.match(/\s(?:каждый|каждую|каждое|по)\s((?:(?:понедельник|вторник|сред|четверг|пятниц|суббот|воскресень)[а-яё]*(?:\s?,\s?|\sи\s|\s)?)+)/i);
      if(m2){ const days=[]; DOWRE.forEach((w,i)=>{ if(new RegExp(w,'i').test(m2[1])) days.push(i); }); if(days.length){ repeat=days; cut(m2[0].replace(/\s?$/,'')+' '); s=' '+s+' '; } }
    }
  }
  // относительные дни
  let m;
  if(/\s(?:на\s)?послезавтра\s/i.test(s)){ due=addDays(T,2); cut(/\s(?:на\s)?послезавтра\s/i); }
  else if((m=s.match(/\s(?:на\s)?завтра\s/i))){ due=addDays(T,1); cut(/\s(?:на\s)?завтра\s/i); }
  else if((m=s.match(/\s(?:на\s)?сегодня\s/i))){ due=T; cut(/\s(?:на\s)?сегодня\s/i); }
  // через N дней/недель
  if(!due && (m=s.match(/\sчерез\s(\d+|[а-яё]+)?\s?(день|дня|дней|неделю|недели|недель)\s/i))){
    const n=m[1]?(Number(m[1])||RU_NUM[m[1].toLowerCase()]||1):1; due=addDays(T,/нед/i.test(m[2])?7*n:n); cut(m[0]);
  }
  // день недели
  if(!due){ for(let i=0;i<7;i++){ const re=new RegExp('\\s(?:в|во|на|к)?\\s?(?:'+RU_DOW[i][0]+'[а-яё]*|'+RU_DOW[i][1]+')\\s','i'); if(re.test(s)){ const dow=now.getDay(); let d=(i-dow+7)%7; if(d===0) d=7; due=addDays(T,d); cut(re); break; } } }
  // 15 октября / 15.10 / 15/10
  if(!due && (m=s.match(/\s(\d{1,2})\s(янв|фев|мар|апр|мая|май|июн|июл|авг|сен|окт|ноя|дек)[а-яё]*\s/i))){
    due=futureDate(now, Number(m[1]), RU_MON[m[2].toLowerCase()]); cut(m[0]);
  }
  if(!due && (m=s.match(/\s(?:на\s|к\s)?(\d{1,2})[./](\d{1,2})(?:[./](\d{2,4}))?\s/))){
    const d=Number(m[1]), mo=Number(m[2]); if(d>=1&&d<=31&&mo>=1&&mo<=12){ due=m[3]?(String(m[3]).length===2?'20'+m[3]:m[3])+'-'+pad(mo)+'-'+pad(d):futureDate(now,d,mo); cut(m[0]); }
  }
  // время
  if((m=s.match(/\s(?:в|к|на)\s(\d{1,2})[:.](\d{2})\s/i))||(m=s.match(/\s(\d{1,2}):(\d{2})\s/))){ const h=Number(m[1]),mi=Number(m[2]); if(h<24&&mi<60){ time=pad(h)+':'+pad(mi); cut(m[0]); } }
  if(!time && (m=s.match(/\s(?:в|к)\s(\d{1,2}|[а-яё]+)\s?(?:час(?:а|ов)?\s?)?(утра|дня|вечера|ночи)?\s/i))){
    let h=/^\d+$/.test(m[1])?Number(m[1]):RU_NUM[m[1].toLowerCase()];
    if(h!=null && h<24){ const p=(m[2]||'').toLowerCase(); if((p==='дня'||p==='вечера')&&h<12) h+=12; if(p==='ночи'&&h===12) h=0;
      if(!p && h>=1 && h<=7) h+=12; time=pad(h)+':00'; cut(m[0]); }
  }
  if(!time && /\sв\sполдень\s/i.test(s)){ time='12:00'; cut(/\sв\sполдень\s/i); }
  if(!time && (m=s.match(/\s(утром|днём|днем|вечером)\s/i))){ time={'утром':'09:00','днём':'13:00','днем':'13:00','вечером':'19:00'}[m[1].toLowerCase()]; cut(m[0]); }
  if(time && !due){ due=T; if(toMin(time) < now.getHours()*60+now.getMinutes()-30) due=addDays(T,1); }
  let title=s.replace(/\s+([,.!?;])/g,'$1').replace(/\s+/g,' ').trim().replace(/^[,.;\s]+/,'').replace(/^(надо|нужно|мне нужно|мне надо|не забыть|напомни(?:ть)?(?: мне)?|запиши|добавь)\s+/i,'').replace(/[,.;\s]+$/,'');
  if(title) title=title.charAt(0).toUpperCase()+title.slice(1);
  const words=title.split(' ').filter(Boolean).length;
  const multi=/[;\n]|\s(?:потом|а также|и ещё|и еще|ещё надо|еще надо)\s/i.test(' '+src+' ') || words>14;
  return { title: title||String(src).trim(), due, time, repeat, multi:multi&&!repeat?multi:(multi&&words>14), found: !!(due||time||repeat) };
}
function futureDate(now, d, mo){ let y=now.getFullYear(); let s=y+'-'+pad(mo)+'-'+pad(d); if(s<dstr(now)) s=(y+1)+'-'+pad(mo)+'-'+pad(d); return s; }

/* ---------- «Выгрузи голову»: длинная диктовка → отдельные дела с описанием ---------- */
async function aiDump(text){
  const prompt = ctxBlock()+'\nСфера по умолчанию: '+(defaultSphere()||'нет')+
  '\n\nЧеловек надиктовал голосом «полотно» — всё, что нужно сделать. Разбери его на отдельные ДЕЛА.\n'+

    S.tasks=S.tasks.filter(x=>{ if(x.recurId!==r.id||x.done||x.id===t.id) return true; const [y,m,dd]=x.due.split('-').map(Number); return days.includes(new Date(y,m-1,dd).getDay()); });
    S.tasks.forEach(x=>{ if(x.recurId===r.id && !x.done && x.id!==t.id){ x.title=t.title; x.note=t.note; x.sphere=t.sphere; x.time=t.time; x.kind=t.kind; } });
  } else {
    const nr=makeRecur(t, days); t.recurId=nr.id;
    const [y,m,dd]=(t.due||T).split('-').map(Number);
    if(!t.due || t.due<T || !days.includes(new Date(y,m-1,dd).getDay())) t.due=nextRepDay(days, T);
  }
  ensureRecur();
}

    case 'evening': eve={mood:(S.days[today()]||{}).mood||0, note:(S.days[today()]||{}).note||''}; eveningSheet(); break;
    case 'ev-done': { const t=findTask(id); if(t){ t.done=true; t.doneAt=Date.now(); haptic(); save(); } eveningSheet(); render(); break; }
    case 'ev-later': { const t=findTask(id); if(t){ t.due=addDays(today(),1); t.postponed=(t.postponed||0)+1; bumpPostponed(1); save(); } eveningSheet(); render(); break; }
    case 'ev-mood': eve.mood=Number(v); eveningSheet(); break;
    case 'ev-close': closeDay(); break;
    case 'skin': pfCollect(); S.skin=v; save(); render(); break;
    case 'mod': { pfCollect(); const k=b.getAttribute('data-k'); S.modules[k]=!S.modules[k]; save(); render(); if(k==='calendar'&&S.modules.calendar) loadCalendar(); break; }
    case 'pf-save': pfCollect(); save(true); render(); scheduleBrief(); toast('Профиль сохранён'); break;
    case 'sph-color': { pfCollect(); const i=Number(b.getAttribute('data-i')); const s=S.spheres[i]; if(!s) break;
      openSheet('<div class="row between"><h2 id="sheet-h">Цвет: '+esc(s.name)+'</h2><button class="btn ghost" data-act="close-sheet">Закрыть</button></div><div class="palette">'+PALETTE.map(([c,n])=>'<button class="swatch" data-act="sph-color-set" data-i="'+i+'" data-v="'+c+'" aria-pressed="'+(s.color===c)+'" aria-label="'+n+'" style="background:'+c+'"></button>').join('')+'</div><button class="btn block-btn" data-act="sph-color-set" data-i="'+i+'" data-v="">Без цвета</button>'); break; }
    case 'sph-color-set': { const s=S.spheres[Number(b.getAttribute('data-i'))]; if(s){ s.color=v||''; save(); } closeSheet(); render(); break; }
    case 'brief-toggle': pfCollect(); S.briefPush=!S.briefPush; save(); render(); scheduleBrief(); toast(S.briefPush?'Утренний план будет приходить в '+S.rhythm.brief:'Утренний план выключен'); break;
    case 'pf-sph-add': pfCollect(); S.spheres.push({id:'s-'+uid(),name:'Новая сфера',group:'personal'}); save(); render(); break;
    case 'hab-add': { pfCollect(); const n=$('#pf-hab').value.trim(); if(!n) return; S.habits.push({id:'h-'+uid(),name:n}); save(); render(); break; }
    case 'hab-del': pfCollect(); S.habits=S.habits.filter(x=>x.id!==id); save(); render(); break;
    case 'clean-done': { pfCollect(); const lim=Date.now()-30*86400000; const before=S.tasks.length; S.tasks=S.tasks.filter(x=>!(x.done&&(x.doneAt||0)<lim)); save(); render(); toast('Убрано: '+(before-S.tasks.length)); break; }
    case 'reonboard': pfCollect(); save(); ui.D=null; ui.ob=1; ui.reob=true; S.onboarded=false; render(); window.scrollTo(0,0); break;
    /* onboarding */
    case 'ob-skin': obCollect(); D.skin=v; render(); break;
    case 'ob-go1': obCollect(); ui.ob=1; render(); window.scrollTo(0,0); break;
    case 'ob-back': obCollect(); D.err=''; ui.ob=Math.max(0,ui.ob-1); render(); break;
    case 'ob-cancel': ui.D=null; ui.reob=false; S.onboarded=true; ui.tab='today'; render(); break;
    case 'ob-build': obBuild(false); break;
    case 'ob-manual': obCollect(); D.err=''; D.built=false; ui.ob=2; render(); window.scrollTo(0,0); break;
    case 'ob-fix': obBuild(true); break;
    case 'ob-finish': obFinish(); break;
    case 'rv-grp': { obCollect(); const s=D.spheres[Number(b.getAttribute('data-i'))]; if(s) s.group=s.group==='work'?'personal':'work'; render(); break; }
    case 'rv-del': { obCollect(); const i=Number(b.getAttribute('data-i')); const gone=D.spheres[i]; D.spheres.splice(i,1); const fb=(D.spheres[0]||{}).id; D.tasks.forEach(t=>{ if(gone&&t.sphere===gone.id) t.sphere=fb; }); render(); break; }
    case 'rv-add': obCollect(); D.spheres.push({id:'s-'+uid(),name:'',group:'personal'}); render(); { const ins=document.querySelectorAll('[data-sph]'); const last=ins[ins.length-1]; if(last) last.focus(); } break;
    case 'rv-hab': { obCollect(); const i=D.habits.indexOf(v); if(i>=0) D.habits.splice(i,1); else D.habits.push(v); render(); break; }
    case 'rv-hab-add': { obCollect(); const n=($('#rv-hab-new')||{}).value; if(n&&n.trim()&&!D.habits.includes(n.trim())) D.habits.push(n.trim()); render(); break; }
    case 'rv-mod': { obCollect(); const k=b.getAttribute('data-k'); D.modules[k]=!D.modules[k]; render(); break; }
    case 'rv-pick': { obCollect(); const t=D.tasks[Number(b.getAttribute('data-i'))]; if(t) t._skip=!t._skip; render(); break; }
  }
});

/* ---------- boot ---------- */
const cached=readLocal();
try{ if(cached) S=merge(cached); }catch(e){ S=DEFAULT(); }
render();
async function pull(){
  if(!cap.ref) return;
  if(saveT||saving) return;
  try{
    const snap=await cap.ref.get();
    if(saveT||saving) return;
    if(snap.exists){
      const remote=merge(snap.data());
      if((remote.updatedAt||0) > (S.updatedAt||0)){ const wasOb=S.onboarded; S=remote; cacheLocal(); if(!(ui.D && !wasOb)) render(); }
      else if((S.updatedAt||0) > (remote.updatedAt||0)) flush();
    } else if(S.updatedAt) flush();
  }catch(e){}
}
/* ---------- голос: запись и распознавание ---------- */
const MIC_FIELDS=['dump-reply','cap-in','ob-story','chat-in','life-in','m-text','ev-note','e-note','rv-fix'];
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const inFrame=(()=>{ try{ return window.top!==window.self; }catch(e){ return true; } })();
let voice={id:null,rec:null,media:null,chunks:[],stopping:false,base:''};
function micLabel(on){ return on?'<span class="mic-dot" aria-hidden="true"></span>Стоп':ICON.mic+'<span>Говорить</span>'; }
function setMicUI(){
  document.querySelectorAll('[data-mic-for]').forEach(b=>{ const on=voice.id===b.getAttribute('data-mic-for'); if(b.dataset.st===String(on)) return; b.dataset.st=String(on); b.classList.toggle('rec',on); b.setAttribute('aria-pressed',on); b.setAttribute('aria-label',on?'Остановить запись':'Записать голосом');
    if(b.classList.contains('mic-round')) b.innerHTML=on?'<span class="mic-dot" aria-hidden="true"></span>':ICON.mic; else b.innerHTML=micLabel(on); });
}
function ensureMics(){
  let added=false;
  MIC_FIELDS.forEach(id=>{
    const el=document.getElementById(id); if(!el||el.dataset.micd) return; el.dataset.micd='1'; added=true;
    const b=document.createElement('button'); b.type='button'; b.setAttribute('data-mic-for',id);
    if(id==='cap-in'){ b.className='mic-round'; const go=el.parentNode.querySelector('.go'); el.parentNode.insertBefore(b, go||null); }
    else { b.className='btn mic-big'; el.insertAdjacentElement('afterend', b); }
  });
  if(added) setMicUI();
}
function fieldSet(id, text){
  const el=document.getElementById(id); if(!el) return;
  el.value=(voice.base?voice.base.replace(/\s*$/,' '):'')+text;
  el.dispatchEvent(new Event('input',{bubbles:true}));
  if(el.tagName==='TEXTAREA') el.scrollTop=el.scrollHeight;
}
function micFail(msg){ voice.id=null; voice.rec=null; setMicUI(); toast(msg, null, true); const el=document.getElementById(voice.lastId); if(el) el.focus(); }
function voiceDone(){
  const id=voice.id; voice.id=null; voice.rec=null; voice.media=null; setMicUI();
  const el=document.getElementById(id);
  if(id==='dump-reply' && el && el.value.trim()){ dump.reply=el.value; dumpReply(); return; }
  if(id==='cap-in' && el && el.value.trim()){ const f=$('#cap-form'); if(f) f.requestSubmit?f.requestSubmit():f.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true})); }
}
function startSR(id){
  const rec=new SR(); rec.lang='ru-RU'; rec.continuous=true; rec.interimResults=true;
  let finalTxt='';
  rec.onresult=e=>{ if(voice.rec!==rec) return; let interim=''; for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal) finalTxt+=r[0].transcript+' '; else interim+=r[0].transcript; } fieldSet(id,(finalTxt+interim).trim()); };
  rec.onerror=e=>{ const c=e&&e.error; if(c==='no-speech'||c==='aborted') return;
    if((c==='not-allowed'||c==='service-not-allowed') && window.RITM_TRANSCRIBE && !inFrame){ voice.rec=null; startRecorder(id); return; }
    micFail(c==='not-allowed'||c==='service-not-allowed'?(inFrame?'Здесь запись недоступна. Нажми на поле и на микрофон на клавиатуре iPhone.':'Разреши доступ к микрофону: Настройки iPhone → Safari → Микрофон.'):'Не получилось распознать речь. Попробуй ещё раз.'); };
  rec.onend=()=>{ if(voice.id===id && voice.rec===rec) voiceDone(); };
  voice.rec=rec; voice.id=id; setMicUI();
  try{ rec.start(); }catch(e){ micFail('Не получилось включить микрофон.'); }
}
async function startRecorder(id){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mime=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))||'';
    const mr=new MediaRecorder(stream, mime?{mimeType:mime}:undefined); voice.chunks=[];
    mr.ondataavailable=e=>{ if(e.data&&e.data.size) voice.chunks.push(e.data); };
    mr.onstop=async()=>{ stream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(voice.chunks,{type:mr.mimeType||'audio/mp4'});
      const b=document.querySelector('[data-mic-for="'+id+'"]'); if(b){ b.disabled=true; b.innerHTML='<span class="spin"></span>Распознаю…'; }
      try{ const text=await window.RITM_TRANSCRIBE(blob); fieldSet(id,String(text||'').trim()); }catch(e){ toast('Не получилось распознать запись. Попробуй ещё раз.', null, true); }
      if(b){ b.disabled=false; delete b.dataset.st; } voiceDone(); };
    voice.media=mr; voice.id=id; setMicUI(); mr.start();
  }catch(e){ micFail(inFrame?'Здесь запись недоступна. Нажми на поле и на микрофон на клавиатуре iPhone.':'Разреши доступ к микрофону: Настройки iPhone → Safari → Микрофон.'); }
}
function stopSR(){
  const rec=voice.rec; voice.rec=null;
  try{ rec.stop(); }catch(e){}
  setTimeout(()=>{ try{ rec.abort(); }catch(e){} }, 400);
  voiceDone();
}
function micToggle(id){
  if(voice.id){ const same=voice.id===id; if(voice.rec){ stopSR(); } else if(voice.media){ voice.media.stop(); } if(same) return; }
  const el=document.getElementById(id); voice.base=el?el.value:''; voice.lastId=id;
  if(SR && !inFrame) startSR(id);
  else if(!inFrame && window.RITM_TRANSCRIBE && navigator.mediaDevices && window.MediaRecorder) startRecorder(id);
  else if(SR) startSR(id);
  else { if(el) el.focus(); toast('Нажми на микрофон на клавиатуре iPhone и говори.', null, true); }
}
document.addEventListener('click', e=>{ const b=e.target.closest&&e.target.closest('[data-mic-for]'); if(!b) return; e.preventDefault(); e.stopPropagation(); micToggle(b.getAttribute('data-mic-for')); }, true);
new MutationObserver(()=>ensureMics()).observe(document.body,{childList:true,subtree:true});

(async function boot(){
  const C=window.claude;
  if(!C||!C.use){ return; }
  const got=await Promise.allSettled(['db','user','sample','mcp'].map(n=>C.use(n)));
  const [db,user,sample,mcp]=got.map(r=>r.status==='fulfilled'?r.value:null);
  cap.sample=sample||null; cap.mcp=mcp||null;
  if(window.RITM_PUSH){ try{ cap.pushState=await window.RITM_PUSH.state(); cap.push=cap.pushState==='on'; }catch(e){ cap.pushState='off'; } }
  let id=null; try{ id = user ? await user.id() : null; }catch(e){}
  try{ cap.profile = user && user.profile ? user.profile() : null; if(cap.profile && cap.profile.name && ui.D && !ui.D.name) ui.D.name=cap.profile.name; }catch(e){}
  if(db && id){
    try{ cap.ref=db.doc('data/users/'+id+'/state'); await pull(); }
    catch(e){ toast('Не удалось загрузить данные из аккаунта. Показываю сохранённые на этом устройстве.', null, true); }
  } else {
    toast('Синхронизация недоступна: данные сохранятся только на этом устройстве.', null, true);
  }
  if(!(ui.D && ui.ob>0)) render();
  if(S.onboarded) loadCalendar();
  if(S.onboarded) scheduleBrief();
  if(S.onboarded && !S.tourDone && !(ui.D)) setTimeout(()=>tourSheet(0),800);
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='hidden'){ if(saveT) flush(); }
    else { pull(); if(S.onboarded) loadCalendar(); }
  });
  window.addEventListener('pagehide', ()=>{ if(saveT) flush(); });
})();
})();
</script>
